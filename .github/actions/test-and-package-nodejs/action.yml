name: Node.js Tests and Packaging

description: Run tests, then optionally package and upload existing build outputs.

inputs:
  extensions:
    description: Compiled extensions bundled with the Node.js package
    default: ''
  package:
    description: Enable packaging tests
    default: 'false'
  upload_artifacts:
    description: Upload tested packages
    default: 'false'
  artifact_platform:
    description: Platform identifier used in artifact names
    required: true
  test_electron:
    description: Run the Windows Electron smoke test as part of the Node.js suite
    default: 'false'

runs:
  using: composite
  steps:

  - name: Stage Native Artifacts
    if: runner.os == 'Windows'
    shell: bash
    env:
      ARTIFACT_PLATFORM: ${{ inputs.artifact_platform }}
      EXTENSIONS: ${{ inputs.extensions }}
    run: |
      set -euo pipefail
      stage_dir="tools/nodejs_bind/build/Release/${ARTIFACT_PLATFORM//-/_}"
      mkdir -p "$stage_dir"
      cp build/tools/nodejs_bind/neug_node_bind.node "$stage_dir/"
      cp build/tools/nodejs_bind/neug.dll "$stage_dir/"
      for extension in ${EXTENSIONS//;/ }; do
        mkdir -p "$stage_dir/extension/$extension"
        cp "build/extension/$extension/lib$extension.neug_extension" "$stage_dir/extension/$extension/"
      done

  # Windows does not build bulk_loader; use the same dataset helper as upstream.
  - name: Prepare Test Data
    if: runner.os == 'Windows'
    shell: bash
    env:
      FLEX_DATA_DIR: ${{ github.workspace }}/example_dataset/modern_graph
    run: |
      set -euo pipefail
      cd tools/nodejs_bind
      node <<'JS'
      const fs = require('fs');
      const { prepareModernGraphDataset } = require('./tests/test-shim');
      const { Database } = require('./lib');
      fs.mkdirSync('/tmp', { recursive: true });
      fs.rmSync('/tmp/modern_graph', { recursive: true, force: true });
      prepareModernGraphDataset(Database);
      JS

  - name: Install Electron for Node.js Smoke Test
    if: runner.os == 'Windows' && inputs.test_electron == 'true'
    shell: pwsh
    run: |
      $PSNativeCommandUseErrorActionPreference = $true
      $ErrorActionPreference = "Stop"
      $electronDir = Join-Path $env:RUNNER_TEMP "neug-electron"
      npm install --prefix "$electronDir" --no-save --package-lock=false electron@40.0.0
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      $electron = Join-Path $electronDir "node_modules/electron/dist/electron.exe"
      if (!(Test-Path $electron)) { throw "Electron executable not found: $electron" }
      "NEUG_ELECTRON_PATH=$electron" >> $env:GITHUB_ENV

  - name: Run Node.js Tests
    shell: bash
    env:
      NEUG_RUN_EXTENSION_TESTS: ${{ inputs.extensions != '' && 'true' || 'false' }}
      NEUG_TEST_EXTENSIONS: ${{ inputs.extensions }}
      FLEX_DATA_DIR: ${{ github.workspace }}/example_dataset/modern_graph
    run: |
      set -euo pipefail
      cd tools/nodejs_bind
      if [[ "$RUNNER_OS" == Linux && "$(id -u)" == 0 ]]; then
        # Permission tests need an unprivileged user. The package container
        # builds as root, including the dataset opened by read/write tests.
        chown -R neug:neug /tmp/modern_graph
        runuser -u neug -- "$(command -v node)" tests/test-shim.js
      else
        node tests/test-shim.js
      fi

  - name: Install npm Packaging Dependency
    if: inputs.package == 'true' && runner.os != 'Windows'
    shell: bash
    env:
      REPAIR_TOOL: ${{ runner.os == 'macOS' && 'delocate' || 'patchelf' }}
    run: |
      python -m pip install "$REPAIR_TOOL"

  - name: Pack Current Node.js Binding
    if: inputs.package == 'true'
    shell: bash
    env:
      ARTIFACT_PLATFORM: ${{ inputs.artifact_platform }}
      EXTENSIONS: ${{ inputs.extensions }}
    run: |
      set -euo pipefail
      # Legacy dependency environment files may reference unset path variables.
      set +u
      case "$RUNNER_OS" in
        Linux) source /home/neug/.neug_env ;;
        macOS) source "$HOME/.neug_env" ;;
      esac
      set -u
      cd tools/nodejs_bind
      # Windows uses the staged .node and DLL; ELF/Mach-O repair does not apply.
      if [[ "$RUNNER_OS" != Windows ]]; then
        make bundle BUILD_TYPE=Release
      fi
      if [[ "$RUNNER_OS" == Linux && -n "$EXTENSIONS" ]]; then
        readelf --dyn-syms --wide "build/Release/${ARTIFACT_PLATFORM//-/_}/libneug.so" | \
          awk '/_ZNK4neug12StorageIndex14ModuleTypeNameB5cxx11Ev/ { found = 1 } END { exit !found }'
      fi
      cp package.json "$RUNNER_TEMP/ci-package.json"
      extension_dir="build/Release/${ARTIFACT_PLATFORM//-/_}/extension"
      saved_extensions=$(mktemp -d "$RUNNER_TEMP/npm-extensions.XXXXXX")
      trap 'cp "$RUNNER_TEMP/ci-package.json" package.json; if [ -d "$saved_extensions/extension" ]; then mv "$saved_extensions/extension" "$extension_dir"; fi' EXIT
      if [ -d "$extension_dir" ]; then
        if [[ "$RUNNER_OS" == Linux && -n "$EXTENSIONS" ]]; then
          mkdir -p "$GITHUB_WORKSPACE/npm_extension_packages"
          for extension in ${EXTENSIONS//;/ }; do
            source="$extension_dir/$extension/lib$extension.neug_extension"
            target="$GITHUB_WORKSPACE/npm_extension_packages/lib$extension-cxx11abi.neug_extension"
            cp "$source" "$target"
          done
          python - <<'PYCODE'
      import hashlib
      import os
      from pathlib import Path
      for package in (Path(os.environ['GITHUB_WORKSPACE']) / 'npm_extension_packages').glob('*.neug_extension'):
          package.with_name(package.name + '.sha256').write_text(
              hashlib.sha256(package.read_bytes()).hexdigest(), encoding='utf-8')
      PYCODE
        fi
        mv "$extension_dir" "$saved_extensions/extension"
      fi
      node <<'JS'
      const fs = require('fs');
      const p = JSON.parse(fs.readFileSync('package.json'));
      p.name = '@neug-ai/' + process.env.ARTIFACT_PLATFORM;
      p.os = [process.platform];
      p.cpu = [process.arch];
      fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
      JS
      npm pack

  - name: Validate npm Package
    if: inputs.package == 'true'
    shell: bash
    env:
      ARTIFACT_PLATFORM: ${{ inputs.artifact_platform }}
      EXTENSIONS: ${{ inputs.extensions }}
    run: |
      set -euo pipefail
      test_dir=$(mktemp -d "$RUNNER_TEMP/neug-npm-validate.XXXXXX")
      cd "$test_dir"
      npm install "$GITHUB_WORKSPACE/tools/nodejs_bind/neug-ai-${ARTIFACT_PLATFORM}-"*.tgz
      node <<'JS'
      const fs = require('fs');
      const path = require('path');
      const name = '@neug-ai/' + process.env.ARTIFACT_PLATFORM;
      const packageDir = path.resolve(path.dirname(require.resolve(name)), '..');
      const platformDir = path.join(packageDir, 'build', 'Release', process.env.ARTIFACT_PLATFORM.replaceAll('-', '_'));
      if (fs.existsSync(path.join(platformDir, 'extension'))) throw new Error('Core npm package contains extensions');
      const source = path.join(process.env.GITHUB_WORKSPACE, 'tools/nodejs_bind/build/Release', process.env.ARTIFACT_PLATFORM.replaceAll('-', '_'), 'extension');
      if (process.env.EXTENSIONS) fs.cpSync(source, path.join(platformDir, 'extension'), { recursive: true });
      const { Database } = require(name);
      const db = new Database({ databasePath: '', mode: 'w' });
      const conn = db.connect();
      for (const extension of process.env.EXTENSIONS.split(';').filter(Boolean)) {
        conn.execute(`LOAD ${extension}`).close();
      }
      const result = conn.execute('RETURN 1');
      console.log(result.toString());
      result.close();
      conn.close();
      db.close();
      JS

  - name: Upload Linux Node.js Extension Packages
    # always(): preserve cxx11abi extensions even if Validate npm Package fails.
    if: always() && runner.os == 'Linux' && inputs.package == 'true' && inputs.upload_artifacts == 'true' && inputs.extensions != ''
    uses: actions/upload-artifact@v4
    with:
      name: extension-packages-${{ inputs.artifact_platform }}-cxx11abi-${{ github.event.release.tag_name || 'package' }}
      path: |
        npm_extension_packages/*.neug_extension
        npm_extension_packages/*.sha256
      if-no-files-found: error
      retention-days: 7

  - name: Upload Node.js
    if: inputs.package == 'true' && inputs.upload_artifacts == 'true'
    uses: actions/upload-artifact@v4
    with:
      name: nodejs-${{ inputs.artifact_platform }}-${{ github.run_id }}
      path: tools/nodejs_bind/*.tgz
      if-no-files-found: error
      retention-days: 7
