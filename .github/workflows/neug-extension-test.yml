name: NeuG Extension Test

on:
  schedule:
    # Run at 08:00 UTC every Saturday
    - cron: '0 8 * * 6'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/neug-extension-test.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.gitmodules'
      - 'third_party/carquet'
      - 'third_party/carquet.patch'
      - 'include/neug/common/**'
      - 'src/common/**'
      - 'tools/python_bind/tests/test_parquet_backend_contract.py'
      - 'example_dataset/tinysnb/parquet/**'
      - 'example_dataset/comprehensive_graph/parquet/**'
      - 'extension/**'
      - 'tools/python_bind/tests/test_hnsw_index.py'
      - 'tools/python_bind/tests/test_hnsw_index_tp.py'
      - 'tools/python_bind/tests/test_gds.py'
      - 'tools/python_bind/tests/test_gds_path.py'
      - 'tools/python_bind/tests/test_gds_concurrency.py'
      - 'tools/python_bind/tests/test_gds_yield.py'
      - 'tools/python_bind/tests/test_graphalytics.py'
      - 'tools/python_bind/tests/test_fts_index.py'
      - 'tools/python_bind/tests/test_fts_index_tp.py'
      - 'tools/python_bind/tests/resources/graphalytics/**'
      - 'tools/python_bind/example/complex_test.py'
  workflow_dispatch:  # Manual trigger (must exist on default branch to see "Run workflow")
    inputs:
      branch:
        description: 'Branch to run the workflow on'
        required: true
        default: 'main'
        type: string

concurrency:
  group: ${{ github.repository }}-${{ github.event.number || github.head_ref || github.sha }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Job 1: Build NeuG with extensions
  # ============================================================
  extension_tests_default:
    runs-on: [self-hosted, daily, linux]
    container:
      image: neug-registry.cn-hongkong.cr.aliyuncs.com/neug/neug-dev:v0.1.3
    env:
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
    steps:
    - name: checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Mark directory safe
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git config --global --add safe.directory "$GITHUB_WORKSPACE/third_party/aliyun-oss-cpp-sdk"
        git config --global --add safe.directory "$GITHUB_WORKSPACE/third_party/parallel-hashmap"
        git config --global --add safe.directory "$GITHUB_WORKSPACE/third_party/pybind11"

    - name: Clean ZVec state from self-hosted runner
      run: |
        git submodule deinit --force third_party/zvec
        git submodule update --init --force --recursive third_party/zvec

    - name: Clean the tool directory for self-hosted runner
      run: |
        rm -rf /__w/_tool/Python

    - name: Cache CCache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache
        key: ${{ runner.os }}-ccache-ext-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-ext-
          ${{ runner.os }}-ccache-

    - name: Setup CCache and build dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y ccache libcurl4-openssl-dev libzstd-dev liblz4-dev zlib1g-dev
        ccache --max-size=2G
        ccache --zero-stats

    - name: Increase the maximum number of opened files
      run: |
        ulimit -n 65535
        sudo chmod -R 777 /etc/security/*
        echo "*   soft  nofile  1048576" | tee -a /etc/security/limits.conf

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Prepare out-of-tree extension fixture
      run: |
        fixture_dir="${RUNNER_TEMP}/neug-ci-out-of-tree-extension"
        cp -R "${GITHUB_WORKSPACE}/extension/test_out_of_tree" "${fixture_dir}"
        echo "CMAKE_ARGS=-DNEUG_EXTENSION_CONFIGS=${fixture_dir}/extension_config.cmake" >> "${GITHUB_ENV}"

    # TODO: After unifying wheel build (neug-manylinux:v0.1.3-x86_64) and dev images (neug-dev:v0.1.3), 
    # skip the build process and use `pip3 install neug` to test the locally built json extension 
    # with the released wheel package.
    - name: Build NeuG with extensions
      run: |
        . /home/neug/.neug_env
        cd ${GITHUB_WORKSPACE}/
        export BUILD_TYPE=RELEASE
        export CMAKE_BUILD_PARALLEL_LEVEL=$(printf '%s\n' "$(nproc)" 32 | awk 'NR==1 || $0<min { min=$0 } END { print min }')
        export BUILD_EXECUTABLES=ON
        export BUILD_HTTP_SERVER=ON
        export BUILD_TEST=ON
        export USE_NINJA=OFF
        export WITH_MIMALLOC=OFF
        export CMAKE_INSTALL_PREFIX=/opt/neug-install/
        export BUILD_EXTENSIONS="parquet;httpfs;gds;pattern_matching;vector_search;fts;test_out_of_tree"
        sudo mkdir -p /opt/neug-install
        sudo chown -R $USER:$USER /opt/neug-install/
        export CMAKE_C_COMPILER_LAUNCHER=ccache
        export CMAKE_CXX_COMPILER_LAUNCHER=ccache
        cd tools/python_bind
        make clean
        make requirements
        make build
        ccache --show-stats

    - name: Verify out-of-tree extension artifact
      run: |
        test -f "${GITHUB_WORKSPACE}/build/extension/test_out_of_tree/libtest_out_of_tree.neug_extension"

    - name: Run Extension C++ Test
      run: |
        export MODERN_GRAPH_DATA_DIR=${GITHUB_WORKSPACE}/example_dataset/modern_graph
        export COMPREHENSIVE_GRAPH_DATA_DIR=${GITHUB_WORKSPACE}/example_dataset/comprehensive_graph
        export FLEX_DATA_DIR=${GITHUB_WORKSPACE}/example_dataset/modern_graph
        export TEST_PATH=${GITHUB_WORKSPACE}/tests
        cd ${GITHUB_WORKSPACE}/build
        ctest --output-on-failure --no-tests=error -R '^parquet_carquet_.*$'
        ctest -R httpfs_extension_test -V
        ctest -R pattern_matching_extension_test -V
        ctest -R fts_extension_test -V
        export FLEX_DATA_DIR=${GITHUB_WORKSPACE}/example_dataset/tinysnb
        ctest -R test_extension -V

    - name: Run Extension Python Test
      run: |
        cd ${GITHUB_WORKSPACE}/tools/python_bind/
        pip3 install -r requirements.txt
        pip3 install -r requirements_dev.txt
        python3 -m pip install pyarrow==24.0.0
        export FLEX_DATA_DIR=${GITHUB_WORKSPACE}/example_dataset/tinysnb
        GLOG_v=10 ${GITHUB_WORKSPACE}/build/tools/utils/bulk_loader -g ../../example_dataset/tinysnb/graph.yaml -l ../../example_dataset/tinysnb/import.yaml -d /tmp/tinysnb
        export FLEX_DATA_DIR=${GITHUB_WORKSPACE}/example_dataset/comprehensive_graph
        GLOG_v=10 ${GITHUB_WORKSPACE}/build/tools/utils/bulk_loader -g ../../example_dataset/comprehensive_graph/graph.yaml -l ../../example_dataset/comprehensive_graph/import.yaml -d /tmp/comprehensive_graph
        NEUG_RUN_EXTENSION_TESTS=true python3 -m pytest -sv tests/test_parquet_backend_contract.py
        NEUG_RUN_EXTENSION_TESTS=true python3 -m pytest -sv tests/test_load.py -k "parquet or httpfs"
        NEUG_RUN_EXTENSION_TESTS=true python3 -m pytest -sv tests/test_load_array.py -k "parquet"
        NEUG_RUN_EXTENSION_TESTS=true python3 -m pytest -sv tests/test_export.py -k "parquet or httpfs"
        NEUG_RUN_EXTENSION_TESTS=true python3 -m pytest -sv tests/test_db_import_export.py -k "copy_from_parquet"
        NEUG_RUN_EXTENSION_TESTS=true python3 -m pytest -sv tests/test_sniffer.py -k "parquet"
        NEUG_RUN_EXTENSION_TESTS=true python3 -m pytest -sv tests/test_copy_temp.py -k "parquet or httpfs"
        NEUG_RUN_EXTENSION_TESTS=true python3 -m pytest -sv tests/test_gds_temp_graph.py
        NEUG_RUN_EXTENSION_TESTS=true python3 -m pytest -sv tests/test_call_params.py
        NEUG_RUN_EXTENSION_TESTS=true python3 -m pytest -sv tests/test_hnsw_index.py
        NEUG_RUN_EXTENSION_TESTS=true python3 -m pytest -sv tests/test_hnsw_index_tp.py
        NEUG_RUN_EXTENSION_TESTS=true python3 -m pytest -sv tests/test_fts_index.py tests/test_fts_index_tp.py
        NEUG_RUN_EXTENSION_TESTS=true python3 -m pytest -sv tests/test_parquet_export_interop.py

    - name: Run GDS Tests
      run: |
        cd ${GITHUB_WORKSPACE}/tools/python_bind/
        python3 -m pytest -sv tests/test_gds.py
        python3 -m pytest -sv tests/test_gds_path.py
        python3 -m pytest -sv tests/test_gds_concurrency.py
        python3 -m pytest -sv tests/test_gds_yield.py

    - name: Run LDBC Graphalytics Conformance Tests
      run: |
        cd ${GITHUB_WORKSPACE}/tools/python_bind/
        python3 -m pytest -sv tests/test_graphalytics.py

  extension_tests_wheel_linux_x86_64:
    runs-on: [self-hosted, daily, linux, x64]
    steps:
      - name: checkout
        id: checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install cibuildwheel
        run: python3 -m pip install cibuildwheel==3.4.0

      - name: Prepare for linux
        run: |
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)" >> $GITHUB_ENV

      - name: Limit builds to CPython 3.13 on PRs
        run: |
          echo "CIBW_SKIP=cp39-* cp38-* cp311-* cp312-* cp310-*" >> $GITHUB_ENV
          echo "CIBW_BUILD=cp313-manylinux_x86_64" >> $GITHUB_ENV

      - name: Build NeuG wheel
        run: |
          export CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)
          export BUILD_TYPE=RELEASE
          export PYBIND11_FINDPYTHON=OFF
          python3 -m cibuildwheel ./tools/python_bind --output-dir wheelhouse

      - name: Build Extension Package
        run: |
          export CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)
          export BUILD_TYPE=RELEASE
          export PYBIND11_FINDPYTHON=OFF
          CI_INSTALL_EXTENSIONS="parquet;httpfs;pattern_matching;vector_search;fts" python3 -m cibuildwheel ./tools/python_bind --output-dir extension_packages

      - name: Clean all installed python packages
        run: |
          python3 -m pip freeze | xargs python3 -m pip uninstall -y || true

      - name: Install Wheel and extension
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip uninstall -y neug || echo "Uninstalled neug if it was installed"
          # install NeuG wheel
          for i in wheelhouse/*.whl; do
            [ -f "$i" ] && python3 -m pip install "$i" || echo "Failed to install $i"
          done
          # install Extension Package (extract first .whl when multiple exist)
          EXT_WHL=$(echo extension_packages/*.whl | awk '{print $1}')
          python3 -m zipfile -e "$EXT_WHL" extension_packages
          # copy extension to the same site-packages where neug is installed
          NEUG_SITE=$(python3 -c "import neug, os; print(os.path.dirname(os.path.dirname(neug.__file__)))")
          mkdir -p $NEUG_SITE/extension
          rm -rf $NEUG_SITE/extension
          cp -r extension_packages/extension $NEUG_SITE/
          # Copy auditwheel-bundled shared libraries (e.g. libcurl)
          # from the extension wheel.  auditwheel renames .so files with a
          # content hash (e.g. libcurl-34c6b10f.so.4.3.0) and places them in
          # <package>.libs/.  Without this step the extension .so files fail to
          # load at runtime because the hash-renamed libraries are missing.
          if [ -d extension_packages/neug.libs ]; then
            mkdir -p $NEUG_SITE/neug.libs
            cp -rf extension_packages/neug.libs/* $NEUG_SITE/neug.libs/
          fi

      - name: Run simple and complex tests
        env:
          TMP_DIR: ${{ github.workspace }}/${{ github.run_id }}
        run: |
          rm -rf ${TMP_DIR}/test_example
          GLOG_v=10 python3 tools/python_bind/example/simple_example.py example_dataset/modern_graph ${TMP_DIR}/test_example
          NEUG_RUN_EXTENSION_TESTS=1 python3 tools/python_bind/example/complex_test.py

  extension_tests_wheel_linux_arm64:
    runs-on: [self-hosted, daily, linux, arm64]
    steps:
      - name: checkout
        id: checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python 3.13
        if: runner.name != 'arm64-1'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
  
      - name: Install cibuildwheel
        run: python3 -m pip install cibuildwheel==3.4.0

      - name: Prepare for linux
        run: |
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)" >> $GITHUB_ENV

      - name: Limit builds to CPython 3.13 on PRs
        run: |
          echo "CIBW_SKIP=cp39-* cp38-* cp311-* cp312-* cp310-*" >> $GITHUB_ENV
          echo "CIBW_BUILD=cp313-manylinux_aarch64" >> $GITHUB_ENV

      - name: Build NeuG wheel
        run: |
          export CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)
          export BUILD_TYPE=RELEASE
          export PYBIND11_FINDPYTHON=OFF
          python3 -m cibuildwheel ./tools/python_bind --output-dir wheelhouse
      
      - name: Build Extension Package
        run: |
          export CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)
          export BUILD_TYPE=RELEASE
          export PYBIND11_FINDPYTHON=OFF
          CI_INSTALL_EXTENSIONS="parquet;httpfs;pattern_matching;vector_search;fts" python3 -m cibuildwheel ./tools/python_bind --output-dir extension_packages

      - name: Clean all installed python packages
        run: |
          python3 -m pip freeze | xargs python3 -m pip uninstall -y || true

      - name: Install Wheel and extension
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip uninstall -y neug || echo "Uninstalled neug if it was installed"
          # install NeuG wheel
          for i in wheelhouse/*.whl; do
            [ -f "$i" ] && python3 -m pip install "$i" || echo "Failed to install $i"
          done
          # install Extension Package (extract first .whl when multiple exist)
          EXT_WHL=$(echo extension_packages/*.whl | awk '{print $1}')
          python3 -m zipfile -e "$EXT_WHL" extension_packages
          # copy extension to the same site-packages where neug is installed
          NEUG_SITE=$(python3 -c "import neug, os; print(os.path.dirname(os.path.dirname(neug.__file__)))")
          mkdir -p $NEUG_SITE/extension
          rm -rf $NEUG_SITE/extension
          cp -r extension_packages/extension $NEUG_SITE/
          if [ -d extension_packages/neug.libs ]; then
            mkdir -p $NEUG_SITE/neug.libs
            cp -rf extension_packages/neug.libs/* $NEUG_SITE/neug.libs/
          fi

      - name: Run simple and complex tests
        env:
          TMP_DIR: ${{ github.workspace }}/${{ github.run_id }}
        run: |
          rm -rf ${TMP_DIR}/test_example
          GLOG_v=10 python3 tools/python_bind/example/simple_example.py example_dataset/modern_graph ${TMP_DIR}/test_example
          NEUG_RUN_EXTENSION_TESTS=1 python3 tools/python_bind/example/complex_test.py

  # ============================================================
  # Job: Windows extension build + load tests (x64 / arm64)
  # Builds every extension except parquet from source under the vcpkg
  # toolchain and validates the local build -> LOAD chain. INSTALL is
  # deliberately not exercised here: no Windows extension packages are
  # published upstream yet.
  # ============================================================
  extension_tests_windows:
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runs-on: windows-latest
            triplet: x64-windows-static-md
          - arch: arm64
            runs-on: windows-11-arm
            triplet: arm64-windows-static-md
    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        shell: pwsh

    env:
      SCCACHE_GHA_ENABLED: 'true'
      # Stable across commits/runners; sccache hashes compiler, inputs and flags.
      SCCACHE_GHA_VERSION: windows-extensions-${{ matrix.triplet }}-v1
      # Environment launchers also reach fresh ExternalProject configurations,
      # including ZVec, without changing other jobs' CMake configuration.
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      NINJA_STATUS: '[%f/%t running=%r elapsed=%es] '

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # GitHub-hosted Windows runners default to core.autocrlf=true, so
      # tracked text files -- including the *.patch files -- are checked out
      # with CRLF, and git apply cannot parse a CRLF patch ("corrupt patch
      # at line N"). Neither CMake file I/O (file(READ) strips CR,
      # file(WRITE) re-adds it on Windows) nor git checkout are reliable
      # normalizers here, so rewrite the bytes directly with tr: LF-only
      # files pass through unchanged, CRLF files become LF byte-exactly.
      # Then re-checkout the submodules that host patched sources with
      # autocrlf off, so the patch target files are LF as well.
      - name: Normalize patch and submodule files to LF (byte-exact)
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          for f in third_party/*.patch third_party/zvec/thirdparty/antlr/antlr4.patch; do
            [ -f "$f" ] || continue
            tr -d '\r' < "$f" > "$f.tmp" && mv "$f.tmp" "$f"
            cr_left=$(tr -dc '\r' < "$f" | wc -c)
            echo "${f}: CR bytes after normalize = ${cr_left}"
          done
          git submodule deinit -f third_party/cppjieba third_party/zvec
          git submodule update --init --force --recursive third_party/cppjieba third_party/zvec

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Setup compiler cache
        id: sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.18.0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/python_bind/requirements.txt
          python -m pip install pytest

      # vcpkg at C:\vcpkg (VCPKG_INSTALLATION_ROOT) ships no pre-built
      # packages and classic mode does not auto-install. fts needs zlib
      # plus an FTS5-enabled sqlite3 (the bundled amalgamation Makefile
      # cannot run in the MSVC toolchain); httpfs needs curl; openssl is
      # required by the core build and by httpfs; parquet's Carquet
      # implementation needs the zstd and lz4 codec libraries.
      - name: Setup vcpkg
        run: |
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          echo "Using vcpkg at: $env:VCPKG_INSTALLATION_ROOT"

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_ROOT }}/installed
          key: vcpkg-${{ matrix.triplet }}-ext-openssl-curl-zlib-zstd-lz4-sqlite3-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            vcpkg-${{ matrix.triplet }}-ext-openssl-curl-zlib-zstd-lz4-sqlite3-

      - name: Install vcpkg packages
        run: |
          $vcpkgExe = Join-Path $env:VCPKG_ROOT "vcpkg.exe"
          $triplet = "${{ matrix.triplet }}"
          $installDir = Join-Path $env:VCPKG_ROOT "installed\$triplet"
          # Skip if already installed (cache hit)
          if (Test-Path (Join-Path $installDir "lib\libssl.lib")) {
            Write-Host "vcpkg packages already installed in $installDir (cache hit)"
          } else {
            Write-Host "Installing openssl/curl/zlib/zstd/lz4/sqlite3[core,fts5]:$triplet via vcpkg"
            & $vcpkgExe install `
              "openssl:$triplet" `
              "curl:$triplet" `
              "zlib:$triplet" `
              "zstd:$triplet" `
              "lz4:$triplet" `
              "sqlite3[core,fts5]:$triplet"
            if ($LASTEXITCODE -ne 0) {
              Write-Error "vcpkg failed to install packages for $triplet"
              exit 1
            }
          }

      - name: Prepare out-of-tree extension fixture
        run: |
          $fixtureDir = Join-Path $env:RUNNER_TEMP "neug-ci-out-of-tree-extension"
          Copy-Item -Recurse -Force `
            (Join-Path $env:GITHUB_WORKSPACE "extension/test_out_of_tree") `
            $fixtureDir
          "NEUG_EXTENSION_CONFIGS=$(Join-Path $fixtureDir 'extension_config.cmake')" >> $env:GITHUB_ENV

      # parquet IS built now: its Arrow C++ dependency was removed (#1128) and
      # it decodes via the Carquet C library, which supports MSVC; Carquet's
      # zstd/lz4/zlib codecs are installed through vcpkg above.
      - name: Configure CMake
        run: |
          $pythonExe = (Get-Command python).Path
          $vcpkgToolchain = Join-Path $env:VCPKG_ROOT "scripts\buildsystems\vcpkg.cmake"
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$vcpkgToolchain" `
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} `
            -DBUILD_PYTHON=ON `
            -DBUILD_HTTP_SERVER=ON `
            -DBUILD_TEST=OFF `
            -DBUILD_EXTENSIONS="fts;gds;httpfs;parquet;pattern_matching;vector_search;test_out_of_tree" `
            -DNEUG_EXTENSION_CONFIGS="${{ env.NEUG_EXTENSION_CONFIGS }}" `
            -DPython_EXECUTABLE="$pythonExe" `
            -DPYTHON_EXECUTABLE="$pythonExe" `
            .

      - name: Build
        run: |
          $cpuCount = [Environment]::ProcessorCount
          $jobs = [Math]::Min($cpuCount, 8)
          Write-Host "Building with $jobs parallel jobs"
          cmake --build build -j $jobs

      - name: Show compiler cache statistics
        if: always() && steps.sccache.outcome == 'success'
        run: sccache --show-stats

      - name: Verify extension artifacts
        run: |
          $expected = @("fts", "gds", "httpfs", "parquet", "pattern_matching", "vector_search", "test_out_of_tree")
          $missing = @()
          foreach ($ext in $expected) {
            $artifact = Join-Path "build/extension/$ext" "lib$ext.neug_extension"
            if (-not (Test-Path $artifact)) { $missing += $artifact }
          }
          if ($missing.Count -gt 0) {
            Write-Error ("Missing extension artifacts: " + ($missing -join ", "))
            exit 1
          }
          Write-Host "All $($expected.Count) extension artifacts present."

      - name: Run extension load tests
        env:
          PYTHONPATH: ${{ github.workspace }}/tools/python_bind
          NEUG_EXTENSION_HOME_PYENV: ${{ github.workspace }}/build
        run: |
          cd tools/python_bind
          python -m pytest -sv tests/test_extension_local_load.py

  # ============================================================
  # Notify: Send results to DingTalk
  # ============================================================
  notify-extension-result:
    needs: [extension_tests_default, extension_tests_wheel_linux_x86_64, extension_tests_wheel_linux_arm64, extension_tests_windows]
    if: always() && github.repository == 'alibaba/neug'
    runs-on: ubuntu-latest
    steps:
      - name: Send DingTalk notification
        env:
          DINGTALK_TOKEN: ${{ secrets.DINGTALK_TOKEN }}
        run: |
          if [ -z "$DINGTALK_TOKEN" ]; then
            echo "DINGTALK_TOKEN not set, skipping notification."
            exit 0
          fi
          WEBHOOK_URL="https://oapi.dingtalk.com/robot/send?access_token=${DINGTALK_TOKEN}"
          STATUS_DEFAULT="${{ needs.extension_tests_default.result }}"
          STATUS_X86="${{ needs.extension_tests_wheel_linux_x86_64.result }}"
          STATUS_ARM="${{ needs.extension_tests_wheel_linux_arm64.result }}"
          STATUS_WIN="${{ needs.extension_tests_windows.result }}"
          if [[ "$STATUS_DEFAULT" == "success" && "$STATUS_X86" == "success" && "$STATUS_ARM" == "success" && "$STATUS_WIN" == "success" ]]; then
            TITLE="[Nightly Report] NeuG Extension Test Passed"
          else
            TITLE="[Nightly Report] NeuG Extension Test Failed"
          fi
          curl -s -X POST "$WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{
              \"msgtype\": \"markdown\",
              \"markdown\": {
                \"title\": \"$TITLE\",
                \"text\": \"## $TITLE\n\n- **extension_tests_default**: ${STATUS_DEFAULT}\n- **wheel_linux_x86_64**: ${STATUS_X86}\n- **wheel_linux_arm64**: ${STATUS_ARM}\n- **windows_x64_arm64**: ${STATUS_WIN}\n- **Repo**: ${{ github.repository }}\n- **Branch**: ${{ github.ref_name }}\n- **Commit**: ${{ github.sha }}\n- [View Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\"
              }
            }"
