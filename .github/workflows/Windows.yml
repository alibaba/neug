name: Windows

on:
  workflow_dispatch: {}
  workflow_call:
    inputs:
      architectures:
        description: 'JSON array of Windows build architectures; only x86_64 is supported.'
        type: string
        default: '["x86_64"]'
      python_versions:
        description: 'Python versions for wheel builds, e.g. "3.13" or "3.12-3.13"; use "all" for all supported versions.'
        type: string
        default: '3.13'
      upload_artifacts:
        type: boolean
        default: false
      coverage:
        type: boolean
        default: false
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-windows-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}-${{ inputs.coverage }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format_check:
    uses: ./.github/workflows/format-check.yml
    with:
      is_pull_request: ${{ github.event_name == 'pull_request' }}

  build_and_test:
    needs: format_check
    name: Windows x86_64
    runs-on: windows-2022
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
      PYTHONPATH: ${{ github.workspace }}/tools/python_bind
      GS_TEST_DIR: ${{ github.workspace }}/gstest
      NEUG_ROOT_DIRECTORY: ${{ github.workspace }}
      BUILD_TYPE: RELEASE
      BUILD_TEST: 'ON'
      BUILD_EXECUTABLES: 'ON'
      BUILD_HTTP_SERVER: 'OFF'
      BUILD_NODEJS: 'OFF'
      WITH_MIMALLOC: 'OFF'
      ENABLE_BACKTRACES: 'OFF'
      NEUG_PACKAGE_BUILD: 'ON'
      NEUG_NATIVE_ARCH: 'OFF'
      USE_NINJA: 'OFF'
      CMAKE_INSTALL_PREFIX: /opt/neug-install
      ENABLE_GCOV: ${{ inputs.coverage && 'ON' || 'OFF' }}
      CMAKE_GENERATOR: Ninja
    steps:
    # ========================================
    # Phase 1: Prepare & Build
    # ========================================

    - name: Checkout
      id: checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
        ref: ${{ github.sha }}

    - name: Setup Python
      id: python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Setup MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Install Windows OpenSSL
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        $ErrorActionPreference = "Stop"
        & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install openssl:x64-windows-static-md
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Install Python Test Dependencies
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        $ErrorActionPreference = "Stop"
        python -m pip install -r tools/python_bind/requirements.txt -r tools/python_bind/requirements_dev.txt pytest-cov coverage wheel setuptools pybind11
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Build NeuG
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        $ErrorActionPreference = "Stop"
        $python = (Get-Command python).Source
        cmake -S . -B "$env:GITHUB_WORKSPACE/build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_PYTHON=ON -DBUILD_TEST=ON -DWITH_MIMALLOC=OFF -DNEUG_PACKAGE_BUILD=ON -DNEUG_NATIVE_ARCH=OFF "-DPython_EXECUTABLE=$python" "-DPYTHON_EXECUTABLE=$python" "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        cmake --build "$env:GITHUB_WORKSPACE/build" -j4
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        "PYTHONPATH=$env:GITHUB_WORKSPACE/tools/python_bind;$env:GITHUB_WORKSPACE/build/tools/python_bind" >> $env:GITHUB_ENV
        "CMAKE_ARGS=-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows-static-md" >> $env:GITHUB_ENV

    # ========================================
    # Phase 2: C++ Tests
    # ========================================

    - name: Run C++ Tests
      uses: ./.github/actions/test-cpp
      with:
        platform: windows

    # ========================================
    # Phase 3: Python Tests
    # ========================================

    - name: Run Python Tests
      uses: ./.github/actions/test-python
      with:
        platform: windows

    # ========================================
    # Phase 6: Wheel Test
    # ========================================

    - name: Wheel Test
      uses: ./.github/actions/package-wheel
      with:
        artifact_platform: windows-x86_64
        oss_platform: windows_x86_64
        python_versions: ${{ inputs.python_versions || '3.13' }}
        extensions: ''
        upload_artifacts: ${{ inputs.upload_artifacts }}

    # ========================================
    # Phase 7: Coverage
    # ========================================

    - name: Generate Coverage
      if: inputs.coverage
      shell: bash
      run: |-
        set -euo pipefail
        cmake --build "$GITHUB_WORKSPACE/build" --target coverage -j4

    - name: Upload Codecov Report
      if: inputs.coverage && github.repository == 'alibaba/neug'
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ${{ github.workspace }}/build/coverage_filtered.info
        fail_ci_if_error: true
