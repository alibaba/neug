name: Windows

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/Windows.yml
      - src/compiler/common/windows_utils.cpp
      - include/neug/compiler/common/windows_utils.h
      - scripts/install_deps.ps1
      - scripts/build_windows.bat
  workflow_call:
    inputs:
      extensions:
        description: 'Semicolon-separated Windows-compatible extensions to build and test.'
        type: string
        default: ''
      architectures:
        description: 'JSON array of Windows build architectures: x86_64 and arm64.'
        type: string
        default: '["x86_64"]'
      python_versions:
        description: 'Python versions for wheel builds, e.g. "3.13" or "3.12-3.13"; use "all" for all supported versions.'
        type: string
        default: '3.13'
      upload_artifacts:
        type: boolean
        default: false
      coverage:
        type: boolean
        default: false
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-windows-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}-${{ inputs.coverage }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format_check:
    uses: ./.github/workflows/format-check.yml
    with:
      is_pull_request: ${{ github.event_name == 'pull_request' }}

  build_and_test:
    needs: format_check
    name: Windows ${{ matrix.arch }}
    strategy:
      fail-fast: true
      matrix:
        arch: ${{ fromJSON(inputs.architectures || '["x86_64"]') }}
    runs-on: ${{ matrix.arch == 'arm64' && 'windows-11-arm' || 'windows-2022' }}
    env:
      SCCACHE_GHA_ENABLED: 'true'
      VCPKG_TARGET_TRIPLET: ${{ matrix.arch == 'arm64' && 'arm64-windows-static-md' || 'x64-windows-static-md' }}
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
      PYTHONPATH: ${{ github.workspace }}/tools/python_bind
      GS_TEST_DIR: ${{ github.workspace }}/gstest
      NEUG_ROOT_DIRECTORY: ${{ github.workspace }}
      BUILD_TYPE: RELEASE
      BUILD_TEST: 'OFF'
      BUILD_EXECUTABLES: 'ON'
      BUILD_EXTENSIONS: ${{ inputs.extensions }}
      BUILD_HTTP_SERVER: 'ON'
      BUILD_NODEJS: 'ON'
      WITH_MIMALLOC: 'OFF'
      ENABLE_BACKTRACES: 'OFF'
      NEUG_PACKAGE_BUILD: 'OFF'
      NEUG_NATIVE_ARCH: 'OFF'
      USE_NINJA: 'OFF'
      CMAKE_INSTALL_PREFIX: /opt/neug-install
      ENABLE_GCOV: ${{ inputs.coverage && 'ON' || 'OFF' }}
      CMAKE_GENERATOR: Ninja
    steps:
    # ========================================
    # Phase 1: Prepare & Build
    # ========================================

    - name: Checkout
      id: checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
        ref: ${{ github.sha }}

    - name: Normalize patch and submodule files to LF (byte-exact)
      shell: bash
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf
        for f in third_party/*.patch third_party/zvec/thirdparty/antlr/antlr4.patch; do
          [ -f "$f" ] || continue
          tr -d '\r' < "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          cr_left=$(tr -dc '\r' < "$f" | wc -c)
          echo "${f}: CR bytes after normalize = ${cr_left}"
        done
        git submodule deinit -f third_party/cppjieba third_party/zvec
        git submodule update --init --force --recursive third_party/cppjieba third_party/zvec

    - name: Setup Python
      id: python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Setup MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.arch == 'arm64' && 'arm64' || 'x64' }}

    - name: Setup vcpkg
      shell: pwsh
      run: |
        echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
        echo "Using vcpkg at: $env:VCPKG_INSTALLATION_ROOT"

    - name: Cache vcpkg packages
      uses: actions/cache@v4
      with:
        path: ${{ env.VCPKG_ROOT }}/installed
        key: vcpkg-${{ env.VCPKG_TARGET_TRIPLET }}-${{ inputs.extensions != '' && 'openssl-curl-zlib-zstd-lz4-sqlite3' || 'openssl' }}-${{ hashFiles('CMakeLists.txt') }}
        restore-keys: |
          vcpkg-${{ env.VCPKG_TARGET_TRIPLET }}-${{ inputs.extensions != '' && 'openssl-curl-zlib-zstd-lz4-sqlite3' || 'openssl' }}-

    - name: Install Windows OpenSSL
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        $ErrorActionPreference = "Stop"
        & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install "openssl:$env:VCPKG_TARGET_TRIPLET"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Install Extension Build Dependencies
      if: inputs.extensions != ''
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        $ErrorActionPreference = "Stop"
        $packages = @("curl", "zlib", "zstd", "lz4", "sqlite3[core,fts5]")
        foreach ($pkg in $packages) {
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install "${pkg}:$env:VCPKG_TARGET_TRIPLET"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }

    - name: Install Python Test Dependencies
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        $ErrorActionPreference = "Stop"
        $devRequirements = "$env:GITHUB_WORKSPACE/tools/python_bind/requirements_dev.txt"
        if ('${{ matrix.arch }}' -eq 'arm64') {
          # clang-format==10.0.1 has no win-arm64 wheel; its LLVM source build exceeds MAX_PATH.
          $devRequirements = "$env:RUNNER_TEMP/requirements_dev_arm64.txt"
          Get-Content tools/python_bind/requirements_dev.txt |
            Where-Object { $_ -notmatch '^\s*clang-format\s*==' } |
            Set-Content -Path $devRequirements
        }
        "PYTHON_DEV_REQUIREMENTS=$devRequirements" >> $env:GITHUB_ENV
        python -m pip install -r tools/python_bind/requirements.txt -r "$devRequirements" pytest-cov coverage wheel setuptools pybind11
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.0.0'
        cache: npm
        cache-dependency-path: tools/nodejs_bind/package-lock.json

    - name: Install Node.js Build Dependencies
      shell: pwsh
      run: |
        npm ci --prefix tools/nodejs_bind

        $nodeVersion = node -p "process.versions.node"
        $nodeArch = node -p "process.arch"
        $nodeDevDir = Join-Path $env:RUNNER_TEMP "node-v$nodeVersion-dev"
        $headersArchive = Join-Path $env:RUNNER_TEMP "node-headers.tar.gz"
        $headersUrl = "https://nodejs.org/dist/v$nodeVersion/node-v$nodeVersion-headers.tar.gz"
        $nodeLibUrl = "https://nodejs.org/dist/v$nodeVersion/win-$nodeArch/node.lib"

        Invoke-WebRequest $headersUrl -OutFile $headersArchive
        New-Item -ItemType Directory -Force $nodeDevDir | Out-Null
        tar -xzf $headersArchive -C $nodeDevDir --strip-components=1
        Invoke-WebRequest $nodeLibUrl -OutFile (Join-Path $nodeDevDir "node.lib")

        "NODE_INCLUDE_DIR=$nodeDevDir\include\node" >> $env:GITHUB_ENV
        "NODE_IMPORT_LIB=$nodeDevDir\node.lib" >> $env:GITHUB_ENV

    - name: Setup compiler cache
      id: sccache
      uses: mozilla-actions/sccache-action@v0.0.11
      with:
        version: 'v0.18.0'

    - name: Build NeuG
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        $ErrorActionPreference = "Stop"
        $python = (Get-Command python).Source
        if ($env:BUILD_EXTENSIONS) {
          foreach ($extension in $env:BUILD_EXTENSIONS.Split(';')) {
            if ($extension -cnotmatch '^[a-z][a-z0-9_]*$') {
              throw "Invalid extension name: '$extension'"
            }
          }
        }
        # Temporary debug logging to investigate why CMake cannot find the installed zstd dependency.
        cmake -S . -B "$env:GITHUB_WORKSPACE/build" -G Ninja `
          --debug-find-var=NEUG_CARQUET_ZSTD_INCLUDE_DIR,NEUG_CARQUET_ZSTD_LIBRARY `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_C_COMPILER_LAUNCHER=sccache `
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
          -DBUILD_PYTHON=ON `
          -DBUILD_NODEJS=ON `
          "-DNODE_INCLUDE_DIR=$env:NODE_INCLUDE_DIR" `
          "-DNODE_IMPORT_LIB=$env:NODE_IMPORT_LIB" `
          -DBUILD_HTTP_SERVER=ON `
          -DBUILD_TEST=OFF `
          "-DBUILD_EXTENSIONS=$env:BUILD_EXTENSIONS" `
          -DWITH_MIMALLOC=OFF `
          -DNEUG_PACKAGE_BUILD=OFF `
          -DNEUG_NATIVE_ARCH=OFF `
          "-DPython_EXECUTABLE=$python" `
          "-DPYTHON_EXECUTABLE=$python" `
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
          "-DVCPKG_TARGET_TRIPLET=$env:VCPKG_TARGET_TRIPLET"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        cmake --build "$env:GITHUB_WORKSPACE/build" -j4
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        "$env:GITHUB_WORKSPACE/build/src" >> $env:GITHUB_PATH
        "PYTHONPATH=$env:GITHUB_WORKSPACE/tools/python_bind;$env:GITHUB_WORKSPACE/build/tools/python_bind" >> $env:GITHUB_ENV
        "CMAKE_ARGS=-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=$env:VCPKG_TARGET_TRIPLET -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache" >> $env:GITHUB_ENV

    - name: Show compiler cache statistics
      if: ${{ always() && steps.sccache.outcome == 'success' }}
      shell: pwsh
      run: sccache --show-stats

    # ========================================
    # Phase 2: C++ Tests
    # ========================================

    - name: Run C++ Tests
      if: ${{ false }}
      uses: ./.github/actions/test-cpp
      with:
        platform: windows
        extensions: ${{ inputs.extensions }}

    # ========================================
    # Phase 3: Python Tests
    # ========================================

    - name: Run Python Tests
      uses: ./.github/actions/test-python
      with:
        platform: windows
        extensions: ${{ inputs.extensions }}

    # ========================================
    # Phase 4: Node.js Tests
    # ========================================

    - name: Run Node.js Tests and Optional Packaging
      uses: ./.github/actions/test-and-package-nodejs
      with:
        extensions: ${{ inputs.extensions }}
        package: 'true'
        artifact_platform: windows-${{ matrix.arch }}
        upload_artifacts: ${{ inputs.upload_artifacts }}

    # ========================================
    # Phase 6: Wheel Test
    # ========================================

    - name: Wheel Test
      uses: ./.github/actions/package-wheel
      with:
        artifact_platform: windows-${{ matrix.arch }}
        oss_platform: win_${{ matrix.arch }}
        python_versions: ${{ inputs.python_versions || '3.13' }}
        extensions: ${{ inputs.extensions }}
        upload_artifacts: ${{ inputs.upload_artifacts }}

    # ========================================
    # Phase 7: Coverage
    # ========================================

    - name: Generate Coverage
      if: inputs.coverage
      shell: bash
      run: |-
        set -euo pipefail
        cmake --build "$GITHUB_WORKSPACE/build" --target coverage -j4

    - name: Upload Codecov Report
      if: inputs.coverage && github.repository == 'alibaba/neug'
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ${{ github.workspace }}/build/coverage_filtered.info
        fail_ci_if_error: true
