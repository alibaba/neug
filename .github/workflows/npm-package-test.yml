name: NPM Package Test

on:
  # Nightly builds call this workflow after uploading the current run's packages.
  workflow_call:
    inputs:
      package_source:
        description: Package source, either npm or artifact
        required: false
        default: artifact
        type: string
  # Manual runs verify the packages currently published to npm.
  workflow_dispatch: {}

concurrency:
  group: ${{ github.repository }}-${{ github.event.number || github.head_ref || github.sha }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  package-test:
    runs-on: ${{ matrix.os }}
    env:
      ARTIFACT_PLATFORM: ${{ matrix.os == 'ubuntu-latest' && 'linux-x86_64' || 'osx-arm64' }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15
        node-version: ["20", "22", "24"]

    steps:
      - name: checkout
        id: checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: tools/nodejs_bind/package-lock.json

      - name: Prepare test workspace
        run: |
          set -euo pipefail

          TEST_WORKSPACE="${RUNNER_TEMP}/neug-npm-package-test"
          rm -rf "${TEST_WORKSPACE}" && mkdir -p "${TEST_WORKSPACE}"

          cp -R "${GITHUB_WORKSPACE}/tools/nodejs_bind/tests" "${TEST_WORKSPACE}/tests"

      - name: Install NeuG package from npm
        if: inputs.package_source != 'artifact'
        run: |
          cd "${RUNNER_TEMP}/neug-npm-package-test"
          npm install neug@npm:@graphscope-neug/neug

      - name: Download npm packages from artifacts
        if: inputs.package_source == 'artifact'
        uses: actions/download-artifact@v4
        with:
          name: nodejs-${{ env.ARTIFACT_PLATFORM }}-${{ github.run_id }}
          path: ${{ runner.temp }}/neug-npm-package-test

      - name: Install NeuG package from artifact
        if: inputs.package_source == 'artifact'
        run: |
          set -euo pipefail

          TEST_WORKSPACE="${RUNNER_TEMP}/neug-npm-package-test"
          cd "${TEST_WORKSPACE}"
          npm install ./graphscope-neug-"${ARTIFACT_PLATFORM}"-*.tgz

          # npm aliases only support registry packages. Recreate the public
          # "neug" alias locally after installing the scoped artifact.
          ln -s "@graphscope-neug/${ARTIFACT_PLATFORM}" node_modules/neug

      - name: Prepare modern graph dataset
        env:
          FLEX_DATA_DIR: ${{ github.workspace }}/example_dataset/modern_graph
        run: |
          set -euo pipefail

          rm -rf /tmp/modern_graph

          cd "${RUNNER_TEMP}/neug-npm-package-test"
          node <<'JS'
          const { prepareModernGraphDataset } = require('./tests/test-shim');
          const { Database } = require('neug');

          prepareModernGraphDataset(Database);
          JS

      - name: Run Node.js tests
        run: |
          cd "${RUNNER_TEMP}/neug-npm-package-test"
          node tests/test-shim.js
