name: nightly-test

on:
  workflow_dispatch:
    inputs:
      linux_x86_64:
        description: Linux x86-64
        type: boolean
        default: true
      linux_arm64:
        description: Linux ARM64
        type: boolean
        default: true
      macos_arm64:
        description: macOS ARM64
        type: boolean
        default: true
      windows_x86_64:
        description: Windows x86-64
        type: boolean
        default: true
      windows_arm64:
        description: Windows ARM64
        type: boolean
        default: true
  schedule:
    # Run at 22:00 CST Tuesday through Sunday; Monday is covered by package.yml.
    - cron: 0 14 * * 0,2-6

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-nightly-test
  cancel-in-progress: false

jobs:
  linux_x86_64:
    if: github.event_name == 'schedule' || inputs.linux_x86_64
    uses: ./.github/workflows/Linux.yml
    with:
      architectures: '["x86_64"]'
      extensions: parquet;httpfs;gds;pattern_matching;vector_search;fts
      packages: '["wheel","npm","java"]'
      python_versions: '3.13'
      coverage: true
    secrets: inherit

  linux_arm64:
    if: github.event_name == 'schedule' || inputs.linux_arm64
    uses: ./.github/workflows/Linux.yml
    with:
      architectures: '["arm64"]'
      extensions: parquet;httpfs;gds;pattern_matching;vector_search;fts
      packages: '["wheel","npm"]'
      python_versions: '3.13'
    secrets: inherit

  macos:
    if: github.event_name == 'schedule' || inputs.macos_arm64
    uses: ./.github/workflows/OSX.yml
    with:
      extensions: parquet;httpfs;gds;pattern_matching;vector_search;fts
      packages: '["wheel","npm"]'
      python_versions: '3.13'
    secrets: inherit

  windows:
    if: github.event_name == 'schedule' || inputs.windows_x86_64 || inputs.windows_arm64
    uses: ./.github/workflows/Windows.yml
    with:
      architectures: ${{ (github.event_name == 'schedule' || (inputs.windows_x86_64 && inputs.windows_arm64)) && '["x86_64","arm64"]' || inputs.windows_arm64 && '["arm64"]' || '["x86_64"]' }}
      # vector_search is not supported by the current Windows build.
      extensions: parquet;httpfs;gds;pattern_matching;fts
      python_versions: '3.13'
      upload_artifacts: true
      test_electron: true
    secrets: inherit

  report:
    if: always()
    needs:
      - linux_x86_64
      - linux_arm64
      - macos
      - windows
    runs-on: ubuntu-22.04
    steps:

    - name: Summarize and Notify Results
      shell: bash
      env:
        RESULTS: ${{ toJSON(needs) }}
        DINGTALK_TOKEN: ${{ secrets.DINGTALK_TOKEN }}
      run: |
        set -euo pipefail
        printf '## CI result\n```json\n%s\n```\n' "$RESULTS" >> "$GITHUB_STEP_SUMMARY"
        if [ -n "$DINGTALK_TOKEN" ] && [ "$GITHUB_REPOSITORY" = alibaba/neug ]; then
          text="NeuG CI: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl --fail -sS -X POST "https://oapi.dingtalk.com/robot/send?access_token=$DINGTALK_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "{\"msgtype\":\"text\",\"text\":{\"content\":\"$text\"}}"
        fi
