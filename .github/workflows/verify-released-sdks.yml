name: Verify Released SDKs

# One-off cross-platform availability check for the PUBLISHED neug SDKs
# (PyPI `neug` wheel + npm `@neug-ai/neug` package). For each platform that has
# a published artifact it verifies, from a clean runner:
#   * base ops (create / insert / query) on an in-memory database
#   * INSTALL + LOAD of all 6 official extensions (downloaded from the release
#     OSS bucket, whose platform token is getOS()+"_"+getArch() => linux_x86_64,
#     linux_arm64, osx_arm64, win_x86_64, win_arm64)
#
# Nothing here builds from source or needs secrets: it only installs public
# packages and downloads public OSS extensions, so it runs on GitHub-hosted
# runners. Triggered by pushing this branch; also dispatchable once on main.
on:
  push:
    branches: [verify-released-sdks-0.3.0]
  workflow_dispatch:
    inputs:
      version:
        description: 'neug version to verify (PyPI + npm)'
        required: false
        default: '0.3.0'
        type: string

concurrency:
  group: ${{ github.repository }}-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  NEUG_VER: ${{ github.event.inputs.version || '0.3.0' }}

jobs:
  # Python wheels are published for linux x86_64/arm64, macos arm64,
  # windows x86_64/arm64 => test all five.
  python-sdk:
    name: py3.12 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest        # linux x86_64
          - ubuntu-24.04-arm     # linux arm64
          - macos-14             # macos arm64
          - windows-2022         # windows x86_64
          - windows-11-arm       # windows arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install released wheel + smoke test
        shell: bash
        env:
          EXPECT_VERSION: ${{ env.NEUG_VER }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install "neug==${NEUG_VER}"
          python scripts/verify_released_python.py

  # @neug-ai/neug publishes platform packages for osx-arm64, linux-x86_64 and
  # windows-x86_64 only => test those three (no linux-arm64 / osx-x86_64 npm pkg).
  node-sdk:
    name: node${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest        # linux x86_64
          - macos-14             # macos arm64
          - windows-2022         # windows x86_64
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install released npm package + smoke test
        shell: bash
        env:
          EXPECT_VERSION: ${{ env.NEUG_VER }}
        run: |
          npm install "@neug-ai/neug@${NEUG_VER}"
          node scripts/verify_released_node.js

  # Deep-dive: capture the Linux Node SIGSEGV at runtime to confirm root cause.
  # Hypothesis: libneug.so statically bundles OpenSSL 1.1.1k and, because
  # cmake/neug_exports.ld does `global: *;` while its `local:` hide-list only
  # covers protobuf/absl/utf8_range (NOT OpenSSL), and neug_symbol_visibility.cmake
  # passes --exclude-libs only for protobuf/utf8_range (NOT libssl.a/libcrypto.a),
  # it re-exports ~2600 OpenSSL symbols into the flat Linux symbol namespace.
  # That collides with the OpenSSL bundled in the node binary => two OpenSSL ABIs
  # in one process => heap corruption => SIGSEGV during the HTTPS extension
  # download (httplib::SSLClient). macOS is immune (two-level namespace).
  linux-node-debug:
    name: linux-node SIGSEGV debug (node22)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install released npm package
        shell: bash
        run: |
          npm install "@neug-ai/neug@${NEUG_VER}"
      - name: Probe node + libneug OpenSSL surfaces
        shell: bash
        run: |
          set +e
          NODE_BIN="$(readlink -f "$(which node)")"
          echo "== node version / bundled openssl =="
          node -e "console.log(process.version, 'openssl', process.versions.openssl)"
          echo "== OpenSSL syms EXPORTED by the node binary (nm -D) =="
          nm -D "$NODE_BIN" 2>/dev/null | grep -cE ' (SSL_|EVP_|CRYPTO_|X509)'
          SO="$(find node_modules -name libneug.so | head -1)"
          echo "== libneug.so path: $SO =="
          echo "-- NEEDED (is OpenSSL dynamic?) --"
          objdump -p "$SO" 2>/dev/null | grep -i NEEDED
          echo "-- embedded OpenSSL version --"
          strings -a "$SO" 2>/dev/null | grep -iE "OpenSSL [0-9]+\.[0-9]+\.[0-9]" | sort -u | head
          echo "-- OpenSSL syms EXPORTED by libneug.so (objdump -T) --"
          objdump -T "$SO" 2>/dev/null | grep -vE '\*UND\*' | grep -cE ' (SSL_|EVP_|CRYPTO_|X509|OPENSSL_|BIO_|ASN1_|RAND_|BN_|EC_|RSA_)'
          echo "-- protobuf/absl syms exported (should be 0 => version-script active) --"
          objdump -T "$SO" 2>/dev/null | grep -vE '\*UND\*' | grep -cE '_ZN6google8protobuf|_ZN4absl'
          true
      - name: Backtrace the SIGSEGV under gdb
        if: always()
        shell: bash
        run: |
          set +e
          which gdb >/dev/null 2>&1 || sudo apt-get install -y gdb >/dev/null 2>&1
          gdb -batch -ex "run" -ex "bt" --args node scripts/verify_released_node.js > gdb.log 2>&1
          echo "==== crash signal + native backtrace ===="
          grep -nE "received signal|SIGSEGV|^#[0-9]+" gdb.log | head -40
      - name: Trace which DSO provides the OpenSSL symbols (LD_DEBUG)
        if: always()
        shell: bash
        run: |
          set +e
          LD_DEBUG=bindings node scripts/verify_released_node.js > run.log 2> ld_bindings.log
          echo "==== OpenSSL symbol bindings (provider DSO) ===="
          grep -iE "SSL_CTX_new|SSL_new|SSL_connect|SSL_read|SSL_write|EVP_|CRYPTO_|X509" ld_bindings.log | head -40
          echo "==== tail of run.log ===="
          tail -15 run.log
