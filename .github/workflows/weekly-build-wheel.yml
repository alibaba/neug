name: Build Weekly Wheels

on:
  # Trigger the workflow on push or pull request,
  # but only for the main branch
  workflow_dispatch:
    inputs:
      python_versions:
        description: 'Python version to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - '3.8'
          - '3.9'
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - linux-x86_64
          - linux-arm64
          - macos-arm64
  schedule:
    # Trigger the workflow at 22:00(CST) every Monday (14:00 UTC)
    - cron: '0 14 * * 1'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/weekly-build-wheel.yml'

concurrency:
  group: ${{ github.repository }}-${{ github.event.number || github.head_ref || github.sha }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build_wheels:
    uses: ./.github/workflows/wheels-common.yml
    with:
      python_versions: ${{ inputs.python_versions }}
      target_platform: ${{ inputs.platform || 'all' }}
      mode: nightly
      set_nightly_version: true
      pybind11_findpython_off: true
      linux_x86_python: '3.13'
      linux_arm_python: '3.13'
      mac_python: '3.13'
      cibuildwheel_version: '3.4.0'
      enable_macos_x86: false
      caller_event_name: ${{ github.event_name }}
    secrets: inherit

  # ============================================================
  # Notify: Send results to DingTalk
  # ============================================================
  notify-weekly-wheel-result:
    needs: [build_wheels]
    if: always() && github.repository == 'alibaba/neug'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Send DingTalk notification
        env:
          DINGTALK_TOKEN: ${{ secrets.DINGTALK_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS: ${{ needs.build_wheels.result }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
          API_URL: ${{ github.api_url }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "$DINGTALK_TOKEN" ]; then
            echo "DINGTALK_TOKEN not set, skipping notification."
            exit 0
          fi
          WEBHOOK_URL="https://oapi.dingtalk.com/robot/send?access_token=${DINGTALK_TOKEN}"
          if [[ "$STATUS" == "success" ]]; then
            TITLE="[Weekly Report] Build Weekly Wheels Passed"
          else
            TITLE="[Weekly Report] Build Weekly Wheels Failed"
          fi
          TEXT=$(printf '## %s\n\n- **build_wheels**: %s\n- **Repo**: %s\n- **Branch**: %s\n- **Commit**: %s\n- [View Run](%s/%s/actions/runs/%s)' \
            "$TITLE" "$STATUS" "$REPO" "$BRANCH" "$COMMIT" "$SERVER_URL" "$REPO" "$RUN_ID")
          ARTIFACT_LINKS=$(curl -sf \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${API_URL}/repos/${REPO}/actions/runs/${RUN_ID}/artifacts" \
            | jq -r --arg prefix "${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}/artifacts" \
              '.artifacts[] | "- [\(.name)](\($prefix)/\(.id))"') \
            || { echo "::warning::Failed to list artifacts for this run" >&2; true; }
          if [ -n "$ARTIFACT_LINKS" ]; then
            TEXT=$(printf '%s\n\n**Wheels**（需登录 GitHub 下载）:\n\n%s' "$TEXT" "$ARTIFACT_LINKS")
          fi
          PAYLOAD=$(jq -n --arg title "$TITLE" --arg text "$TEXT" \
            '{msgtype: "markdown", markdown: {title: $title, text: $text}}')
          curl -s -X POST "$WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD"
