  test_wheels_macos_x86_64:
    needs: build_wheels_macos_x86_64
    if: ${{
          inputs.enable_macos_x86 &&
          ((inputs.mode == 'release' && (inputs.caller_event_name == 'workflow_dispatch' || (inputs.caller_event_name == 'push' && startsWith(github.ref, 'refs/tags/')))) ||
          (inputs.mode == 'nightly' && inputs.caller_event_name == 'workflow_dispatch' && github.repository == 'alibaba/neug'))
        }}    
    runs-on: macos-15-intel
    strategy:
      matrix:
        python-version: ['3.14']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          name: wheels-macos-x86_64-${{ github.run_id }}
          path: wheelhouse

      - name: Install wheel and run complex test
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip uninstall -y neug || true
          PY_VERSION="${{ matrix.python-version }}"
          PY_TAG="cp$(echo "$PY_VERSION" | tr -d '.')"
          TARGET=$(ls wheelhouse/*${PY_TAG}*.whl | head -n 1 || true)
          if [ -z "$TARGET" ]; then
            echo "No wheel found for tag ${PY_TAG}"
            ls -R wheelhouse
            exit 1
          fi
          echo "Installing $TARGET"
          python -m pip install "$TARGET"
          python tools/python_bind/example/complex_test.py

  test_wheels_macos_aarch64:
    needs: build_wheels_macos_aarch64
    if: ${{
          (inputs.mode == 'release' && (inputs.caller_event_name == 'workflow_dispatch' || (inputs.caller_event_name == 'push' && startsWith(github.ref, 'refs/tags/')))) ||
          (inputs.mode == 'nightly' && inputs.caller_event_name == 'workflow_dispatch' && github.repository == 'alibaba/neug')
        }}
    runs-on: macos-15
    strategy:
      matrix:
        python-version: ['3.14']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          name: wheels-macos-arm64-${{ github.run_id }}
          path: wheelhouse

      - name: Install wheel and run complex test
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip uninstall -y neug || true
          PY_VERSION="${{ matrix.python-version }}"
          PY_TAG="cp$(echo "$PY_VERSION" | tr -d '.')"
          TARGET=$(ls wheelhouse/*${PY_TAG}*.whl | head -n 1 || true)
          if [ -z "$TARGET" ]; then
            echo "No wheel found for tag ${PY_TAG}"
            ls -R wheelhouse
            exit 1
          fi
          echo "Installing $TARGET"
          python -m pip install "$TARGET"
          python tools/python_bind/example/complex_test.py

  publish_to_pypi:
    name: Publish wheels to PyPI
    needs:
      - build_wheels_linux_x86_64
      - build_wheels_linux_arm64
      - build_wheels_macos_aarch64
      - build_wheels_windows_x86_64
      - build_wheels_windows_arm64
    runs-on: ubuntu-latest
    if: ${{
          inputs.mode == 'release' &&
          github.repository == 'alibaba/neug' &&
          (
            inputs.caller_event_name == 'release' ||
            (inputs.caller_event_name == 'workflow_dispatch' && inputs.publish_to_pypi)
          )
        }}
    steps:
      - name: Download Linux x86_64 wheels
        uses: actions/download-artifact@v4
        with:
          name: wheels-linux-x86_64-${{ github.run_id }}
          path: wheelhouse

      - name: Download Linux arm64 wheels
        uses: actions/download-artifact@v4
        with:
          name: wheels-linux-arm64-${{ github.run_id }}
          path: wheelhouse

      - name: Download macOS arm64 wheels
        uses: actions/download-artifact@v4
        with:
          name: wheels-macos-arm64-${{ github.run_id }}
          path: wheelhouse

      - name: Download Windows x86_64 wheels
        uses: actions/download-artifact@v4
        with:
          name: wheels-windows-x86_64-${{ github.run_id }}
          path: wheelhouse

      - name: Download Windows arm64 wheels
        uses: actions/download-artifact@v4
        with:
          name: wheels-windows-arm64-${{ github.run_id }}
          path: wheelhouse

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@v1.13.0
        with:
          user: __token__
          password: ${{ secrets.PYPI_PASSWORD }}
          packages_dir: wheelhouse/
          verbose: true
          skip_existing: true
