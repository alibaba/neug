name: Wheels Build (Reusable)

on:
  workflow_call:
    inputs:
      python_versions:
        type: string
        required: false
        default: ''
      target_platform:
        type: string
        required: false
        default: 'all'
      mode:
        type: string
        required: false
        default: 'release'
      set_nightly_version:
        type: boolean
        required: false
        default: false
      pybind11_findpython_off:
        type: boolean
        required: false
        default: false
      linux_x86_python:
        type: string
        required: false
        default: '3.14'
      linux_arm_python:
        type: string
        required: false
        default: '3.13'
      mac_python:
        type: string
        required: false
        default: '3.14'
      windows_python:
        type: string
        required: false
        default: '3.11'
      cibuildwheel_version:
        type: string
        required: false
        default: '3.4.0'
      enable_macos_x86:
        type: boolean
        required: false
        default: false
      caller_event_name:
        type: string
        required: false
        default: 'workflow_call'
      publish_to_pypi:
        type: boolean
        required: false
        default: true
    secrets:
      PYPI_PASSWORD:
        required: false

jobs:
  determine_python_versions:
    runs-on: ubuntu-latest
    outputs:
      cibw_build: ${{ steps.compute.outputs.cibw_build }}
    env:
      WORKFLOW_PYTHON_VERSIONS: ${{ inputs.python_versions }}
      CALLER_EVENT_NAME: ${{ inputs.caller_event_name }}
    steps:
      - name: Compute Python build selection
        id: compute
        run: |
          set -euo pipefail

          EVENT_NAME="${CALLER_EVENT_NAME:-workflow_call}"
          INPUT="${WORKFLOW_PYTHON_VERSIONS:-}"
          CIBW=""

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            CIBW="cp313-*"
          elif [[ "$INPUT" == "all" ]]; then
            CIBW=""
          elif [[ -n "$INPUT" ]]; then
            SPEC="${INPUT//[[:space:]]/}"

            if [[ "$SPEC" =~ ^3\.[0-9]+-3\.[0-9]+$ ]]; then
              START="${SPEC%%-*}"
              END="${SPEC##*-}"
            elif [[ "$SPEC" =~ ^3\.[0-9]+$ ]]; then
              START="$SPEC"
              END="$SPEC"
            else
              echo "Invalid python_versions input: $INPUT" >&2
              exit 1
            fi

            START_MINOR="${START#3.}"
            END_MINOR="${END#3.}"

            if (( 10#$START_MINOR > 10#$END_MINOR )); then
              echo "Invalid python_versions range: $START -> $END" >&2
              exit 1
            fi

            patterns=()
            for (( minor=10#$START_MINOR; minor<=10#$END_MINOR; minor++ )); do
              patterns+=("cp3${minor}-*")
            done

            CIBW="${patterns[*]}"
          fi

          echo "Using CIBW_BUILD pattern: ${CIBW:-<default>}"
          echo "cibw_build=$CIBW" >> "$GITHUB_OUTPUT"

  build_wheels_linux_x86_64:
    needs:
      - determine_python_versions
    runs-on: [self-hosted, daily, linux, x64]
    if: ${{ (inputs.target_platform == 'all' || inputs.target_platform == 'linux-x86_64') && (
          (
            inputs.mode == 'release' &&
            (
              startsWith(github.ref, 'refs/tags/v') ||
              inputs.caller_event_name == 'workflow_dispatch' ||
              inputs.caller_event_name == 'pull_request' ||
              (inputs.caller_event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'alibaba/neug')
            )
          ) ||
          (
            inputs.mode == 'nightly' &&
            github.repository == 'alibaba/neug' &&
            (inputs.caller_event_name == 'schedule' || inputs.caller_event_name == 'workflow_dispatch' || inputs.caller_event_name == 'pull_request' || (inputs.caller_event_name == 'push' && github.ref == 'refs/heads/main'))
          )
        ) }}
    env:
      CIBW_BUILD: ${{ needs.determine_python_versions.outputs.cibw_build }}
      NEUG_COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: checkout
        id: checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Clean the tool directory for self-hosted runner
        run: |
          rm -rf /__w/_tool/Python

      - name: Setup Python for linux x86_64
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.linux_x86_python }}

      - name: Install cibuildwheel
        run: python3 -m pip install cibuildwheel==${{ inputs.cibuildwheel_version }}

      - name: Prepare for linux
        run: |
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)" >> $GITHUB_ENV

      - name: Set nightly wheel version
        if: inputs.set_nightly_version
        run: |
          version=$(cat ${GITHUB_WORKSPACE}/NEUG_VERSION)
          short_sha=$(git rev-parse --short HEAD)
          echo "${version}+${short_sha}" > ${GITHUB_WORKSPACE}/NEUG_VERSION

      - name: Force Pybind11 FindPython off
        if: inputs.pybind11_findpython_off
        run: |
          echo "PYBIND11_FINDPYTHON=OFF" >> $GITHUB_ENV

      - name: Build wheels
        run: |
          export CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)
          export BUILD_TYPE=RELEASE
          python3 -m cibuildwheel ./tools/python_bind --output-dir wheelhouse

      - name: Upload wheel artifacts
        if: ${{
              (inputs.mode == 'release' && (inputs.caller_event_name == 'workflow_dispatch' || inputs.caller_event_name == 'release' || (inputs.caller_event_name == 'push' && startsWith(github.ref, 'refs/tags/')))) ||
              (inputs.mode == 'nightly' && (inputs.caller_event_name == 'workflow_dispatch' || inputs.caller_event_name == 'schedule') && github.repository == 'alibaba/neug')
            }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.mode == 'nightly' && format('cibw-wheels-linux-x86_64-{0}', github.sha) || format('wheels-linux-x86_64-{0}', github.run_id) }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

      - name: Clean all installed python packages
        run: |
          python3 -m pip freeze | xargs python3 -m pip uninstall -y || true
    
      - name: Run simple and complex tests
        if: inputs.mode == 'release'
        env:
          TMP_DIR: ${{ github.workspace }}/${{ github.run_id }}
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip uninstall -y neug || echo "Uninstalled neug if it was installed"
          for i in $(ls wheelhouse/*.whl); do
            python3 -m pip install "$i" || echo "Failed to install $i"
          done
          rm -rf ${TMP_DIR}/test_example
          GLOG_v=10 python3 tools/python_bind/example/simple_example.py example_dataset/modern_graph ${TMP_DIR}/test_example
          python3 tools/python_bind/example/complex_test.py

      - name: Run NeuG-Cli test
        if: inputs.mode == 'release'
        run: |
          neug-cli --help
          neug-cli --version

      - name: Run nightly sanity test
        if: ${{ inputs.mode == 'nightly' && inputs.caller_event_name == 'schedule' && github.ref == 'refs/heads/main' && github.repository == 'alibaba/neug' }}
        env:
          TMP_DIR: ${{ github.workspace }}/${{ github.run_id }}
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip uninstall -y neug || echo "Uninstalled neug if it was installed"
          for i in $(ls wheelhouse/*.whl); do
            python3 -m pip install "$i" || echo "Failed to install $i"
          done
          rm -rf ${TMP_DIR}/test_example
          GLOG_v=10 python3 tools/python_bind/example/simple_example.py example_dataset/modern_graph ${TMP_DIR}/test_example

      - name: Run nightly NeuG-Cli test
        if: ${{ inputs.mode == 'nightly' && inputs.caller_event_name == 'schedule' && github.ref == 'refs/heads/main' && github.repository == 'alibaba/neug' }}
        run: |
          neug-cli --help
          neug-cli --version

  build_wheels_linux_arm64:
    needs:
      - determine_python_versions
    runs-on: [self-hosted, daily, linux, arm64]
    if: ${{ (inputs.target_platform == 'all' || inputs.target_platform == 'linux-arm64') && (
          (
            inputs.mode == 'release' &&
            (
              startsWith(github.ref, 'refs/tags/v') ||
              inputs.caller_event_name == 'workflow_dispatch' ||
              (inputs.caller_event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'alibaba/neug')
            )
          ) ||
          (
            inputs.mode == 'nightly' &&
            github.repository == 'alibaba/neug' &&
            (inputs.caller_event_name == 'schedule' || inputs.caller_event_name == 'workflow_dispatch' || inputs.caller_event_name == 'pull_request')
          )
        ) }}
    env:
      CIBW_BUILD: ${{ needs.determine_python_versions.outputs.cibw_build }}
      NEUG_COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: checkout
        id: checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Clean the tool directory for self-hosted runner
        run: |
          rm -rf /__w/_tool/Python

      - name: Setup Python for linux arm64
        if: runner.name != 'arm64-1'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.linux_arm_python }}

      - name: Install cibuildwheel
        run: python3 -m pip install cibuildwheel==${{ inputs.cibuildwheel_version }}

      - name: Prepare for linux
        run: |
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)" >> $GITHUB_ENV

      - name: Set nightly wheel version
        if: inputs.set_nightly_version
        run: |
          version=$(cat ${GITHUB_WORKSPACE}/NEUG_VERSION)
          short_sha=$(git rev-parse --short HEAD)
          echo "${version}+${short_sha}" > ${GITHUB_WORKSPACE}/NEUG_VERSION

      - name: Force Pybind11 FindPython off
        if: inputs.pybind11_findpython_off
        run: |
          echo "PYBIND11_FINDPYTHON=OFF" >> $GITHUB_ENV

      - name: Build wheels
        run: |
          export CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)
          export BUILD_TYPE=RELEASE
          python3 -m cibuildwheel ./tools/python_bind --output-dir wheelhouse

      - name: Upload wheel artifacts
        if: ${{
              (inputs.mode == 'release' && (inputs.caller_event_name == 'workflow_dispatch' || inputs.caller_event_name == 'release' || (inputs.caller_event_name == 'push' && startsWith(github.ref, 'refs/tags/')))) ||
              (inputs.mode == 'nightly' && (inputs.caller_event_name == 'workflow_dispatch' || inputs.caller_event_name == 'schedule') && github.repository == 'alibaba/neug')
            }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.mode == 'nightly' && format('cibw-wheels-linux-arm64-{0}', github.sha) || format('wheels-linux-arm64-{0}', github.run_id) }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

      - name: Clean all installed python packages
        run: |
          python3 -m pip freeze | xargs python3 -m pip uninstall -y || true
    
      - name: Run simple and complex tests
        if: inputs.mode == 'release'
        env:
          TMP_DIR: ${{ github.workspace }}/${{ github.run_id }}
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip uninstall -y neug || echo "Uninstalled neug if it was installed"
          for i in $(ls wheelhouse/*.whl); do
            python3 -m pip install "$i" || echo "Failed to install $i"
          done
          rm -rf ${TMP_DIR}/test_example
          GLOG_v=10 python3 tools/python_bind/example/simple_example.py example_dataset/modern_graph ${TMP_DIR}/test_example
          python3 tools/python_bind/example/complex_test.py

      - name: Run NeuG-Cli test
        if: inputs.mode == 'release'
        run: |
          neug-cli --help
          neug-cli --version

      - name: Run nightly sanity test
        if: ${{ inputs.mode == 'nightly' && inputs.caller_event_name == 'schedule' && github.ref == 'refs/heads/main' && github.repository == 'alibaba/neug' }}
        env:
          TMP_DIR: ${{ github.workspace }}/${{ github.run_id }}
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip uninstall -y neug || echo "Uninstalled neug if it was installed"
          for i in $(ls wheelhouse/*.whl); do
            python3 -m pip install "$i" || echo "Failed to install $i"
          done
          rm -rf ${TMP_DIR}/test_example
          GLOG_v=10 python3 tools/python_bind/example/simple_example.py example_dataset/modern_graph ${TMP_DIR}/test_example

      - name: Run nightly NeuG-Cli test
        if: ${{ inputs.mode == 'nightly' && inputs.caller_event_name == 'schedule' && github.ref == 'refs/heads/main' && github.repository == 'alibaba/neug' }}
        run: |
          neug-cli --help
          neug-cli --version

  build_wheels_macos_x86_64:
    needs:
      - determine_python_versions
    runs-on: macos-15-intel
    if: inputs.enable_macos_x86
    env:
      CIBW_BUILD: ${{ needs.determine_python_versions.outputs.cibw_build }}
      NEUG_COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: checkout
        id: checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python for macos x86_64
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.mac_python }}

      - name: Cache cibuildwheel downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/cibuildwheel
          key: ${{ runner.os }}-${{ runner.arch }}-cibw-cache-v1

      - name: Pre-download virtualenv.pyz (retry on 429)
        run: |
          set -euo pipefail
          mkdir -p ~/Library/Caches/cibuildwheel
          VENV_PYZ=~/Library/Caches/cibuildwheel/virtualenv-20.32.0.pyz
          if [ -s "$VENV_PYZ" ]; then
            echo "Using cached virtualenv.pyz: $VENV_PYZ"
            exit 0
          fi
          URL_PRIMARY="https://raw.githubusercontent.com/pypa/get-virtualenv/20.32.0/public/virtualenv.pyz"
          URL_FALLBACK="https://github.com/pypa/get-virtualenv/blob/20.32.0/public/virtualenv.pyz?raw=true"
          curl -fL --retry 8 --retry-all-errors --retry-delay 3 --retry-max-time 300 -o "$VENV_PYZ" "$URL_PRIMARY" || \
          curl -fL --retry 8 --retry-all-errors --retry-delay 3 --retry-max-time 300 -o "$VENV_PYZ" "$URL_FALLBACK"
          test -s "$VENV_PYZ"

      - name: Install dependencies
        run: |
          bash scripts/install_deps.sh

      - name: Install cibuildwheel
        run: python3 -m pip install cibuildwheel==${{ inputs.cibuildwheel_version }}

      - name: Prepare for macos
        run: |
          echo "MACOSX_DEPLOYMENT_TARGET=10.15" >> $GITHUB_ENV
          echo "MACOSX_DEPLOYMENT_TARGET=10.15"
          source ~/.neug_env
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$(sysctl -n hw.ncpu)" >> $GITHUB_ENV

      - name: Set nightly wheel version
        if: inputs.set_nightly_version
        run: |
          version=$(cat ${GITHUB_WORKSPACE}/NEUG_VERSION)
          short_sha=$(git rev-parse --short HEAD)
          echo "${version}+${short_sha}" > ${GITHUB_WORKSPACE}/NEUG_VERSION

      - name: Force Pybind11 FindPython off
        if: inputs.pybind11_findpython_off
        run: |
          echo "PYBIND11_FINDPYTHON=OFF" >> $GITHUB_ENV

      - name: Build wheels
        run: |
          source ~/.neug_env
          export CMAKE_BUILD_PARALLEL_LEVEL=$(sysctl -n hw.ncpu)
          export BUILD_TYPE=RELEASE
          python3 -m cibuildwheel ./tools/python_bind --output-dir wheelhouse

      - name: Upload wheel artifacts
        if: ${{ inputs.mode == 'release' && (inputs.caller_event_name == 'workflow_dispatch' || (inputs.caller_event_name == 'push' && startsWith(github.ref, 'refs/tags/'))) }}
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-x86_64-${{ github.run_id }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

      # Action only supported on linux, skipped
      # - name: Publish distribution to PyPI
      #   uses: pypa/gh-action-pypi-publish@v1.13.0
      #   if: ${{ inputs.mode == 'release' && ((github.ref == 'refs/heads/main' && github.repository == 'alibaba/neug') || (inputs.caller_event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'alibaba/neug')) }}
      #   with:
      #     user: __token__
      #     password: ${{ secrets.PYPI_PASSWORD }}
      #     packages_dir: wheelhouse/
      #     verbose: true
      #     skip_existing: true

      - name: Clean all installed python packages
        run: |
          python3 -m pip freeze | xargs python3 -m pip uninstall -y || true
    
      - name: Run simple test
        if: inputs.mode == 'release'
        env:
          TMP_DIR: ${{ github.workspace }}/${{ github.run_id }}
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip uninstall -y neug || echo "Uninstalled neug if it was installed"
          for i in $(ls wheelhouse/*.whl); do
            python3 -m pip install "$i" || echo "Failed to install $i"
          done
          rm -rf ${TMP_DIR}/test_example
          GLOG_v=10 python3 tools/python_bind/example/simple_example.py example_dataset/modern_graph ${TMP_DIR}/test_example

      - name: Run NeuG-Cli test
        if: inputs.mode == 'release'
        run: |
          neug-cli --help
          neug-cli --version

  build_wheels_macos_aarch64:
    needs:
      - determine_python_versions
    runs-on: macos-15
    if: ${{ (inputs.target_platform == 'all' || inputs.target_platform == 'macos-arm64') && (
          (
            inputs.mode == 'release' &&
            (
              startsWith(github.ref, 'refs/tags/v') ||
              inputs.caller_event_name == 'workflow_dispatch' ||
              inputs.caller_event_name == 'pull_request' ||
              (inputs.caller_event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'alibaba/neug')
            )
          ) ||
          (
            inputs.mode == 'nightly' &&
            (
              inputs.caller_event_name == 'schedule' ||
              inputs.caller_event_name == 'workflow_dispatch' ||
              (inputs.caller_event_name == 'pull_request' && github.repository == 'alibaba/neug')
            )
          )
        ) }}
    env:
      CIBW_BUILD: ${{ needs.determine_python_versions.outputs.cibw_build }}
      NEUG_COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: checkout
        id: checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python for macos aarch64
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.mac_python }}

      - name: Cache cibuildwheel downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/cibuildwheel
          key: ${{ runner.os }}-${{ runner.arch }}-cibw-cache-v1

      - name: Pre-download virtualenv.pyz (retry on 429)
        run: |
          set -euo pipefail
          mkdir -p ~/Library/Caches/cibuildwheel
          VENV_PYZ=~/Library/Caches/cibuildwheel/virtualenv-20.32.0.pyz
          if [ -s "$VENV_PYZ" ]; then
            echo "Using cached virtualenv.pyz: $VENV_PYZ"
            exit 0
          fi
          URL_PRIMARY="https://raw.githubusercontent.com/pypa/get-virtualenv/20.32.0/public/virtualenv.pyz"
          URL_FALLBACK="https://github.com/pypa/get-virtualenv/blob/20.32.0/public/virtualenv.pyz?raw=true"
          curl -fL --retry 8 --retry-all-errors --retry-delay 3 --retry-max-time 300 -o "$VENV_PYZ" "$URL_PRIMARY" || \
          curl -fL --retry 8 --retry-all-errors --retry-delay 3 --retry-max-time 300 -o "$VENV_PYZ" "$URL_FALLBACK"
          test -s "$VENV_PYZ"

      - name: Install dependencies
        run: |
          bash scripts/install_deps.sh

      - name: Install cibuildwheel
        run: python3 -m pip install cibuildwheel==${{ inputs.cibuildwheel_version }}

      - name: Prepare for macos
        run: |
          echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> $GITHUB_ENV
          echo "MACOSX_DEPLOYMENT_TARGET=11.0"
          source ~/.neug_env
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$(sysctl -n hw.ncpu)" >> $GITHUB_ENV

      - name: Set nightly wheel version
        if: inputs.set_nightly_version
        run: |
          version=$(cat ${GITHUB_WORKSPACE}/NEUG_VERSION)
          short_sha=$(git rev-parse --short HEAD)
          echo "${version}+${short_sha}" > ${GITHUB_WORKSPACE}/NEUG_VERSION

      - name: Force Pybind11 FindPython off
        if: inputs.pybind11_findpython_off
        run: |
          echo "PYBIND11_FINDPYTHON=OFF" >> $GITHUB_ENV

      - name: Build wheels
        run: |
          source ~/.neug_env
          export CMAKE_BUILD_PARALLEL_LEVEL=$(sysctl -n hw.ncpu)
          export BUILD_TYPE=RELEASE
          python3 -m cibuildwheel ./tools/python_bind --output-dir wheelhouse

      - name: Upload wheel artifacts
        if: ${{
              (inputs.mode == 'release' && (inputs.caller_event_name == 'workflow_dispatch' || inputs.caller_event_name == 'release' || (inputs.caller_event_name == 'push' && startsWith(github.ref, 'refs/tags/')))) ||
              (inputs.mode == 'nightly' && (inputs.caller_event_name == 'workflow_dispatch' || inputs.caller_event_name == 'schedule') && github.repository == 'alibaba/neug')
            }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.mode == 'nightly' && format('cibw-wheels-macos-arm64-{0}', github.sha) || format('wheels-macos-arm64-{0}', github.run_id) }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

      - name: Clean all installed python packages
        run: |
          python3 -m pip freeze | xargs python3 -m pip uninstall -y || true
    
      - name: Run simple test
        if: inputs.mode == 'release'
        env:
          TMP_DIR: ${{ github.workspace }}/${{ github.run_id }}
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip uninstall -y neug || echo "Uninstalled neug if it was installed"
          for i in $(ls wheelhouse/*.whl); do
            python3 -m pip install "$i" || echo "Failed to install $i"
          done
          rm -rf ${TMP_DIR}/test_example
          GLOG_v=10 python3 tools/python_bind/example/simple_example.py example_dataset/modern_graph ${TMP_DIR}/test_example

      - name: Run NeuG-Cli test
        if: inputs.mode == 'release'
        run: |
          neug-cli --help
          neug-cli --version

  build_wheels_windows_x86_64:
    needs:
      - determine_python_versions
    runs-on: windows-2022
    timeout-minutes: 300
    defaults:
      run:
        shell: pwsh
    if: ${{ (inputs.target_platform == 'all' || inputs.target_platform == 'windows-x86_64') && (
          (
            inputs.mode == 'release' &&
            (
              startsWith(github.ref, 'refs/tags/v') ||
              inputs.caller_event_name == 'workflow_dispatch' ||
              inputs.caller_event_name == 'pull_request' ||
              (inputs.caller_event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'alibaba/neug')
            )
          ) ||
          (
            inputs.mode == 'nightly' &&
            (
              inputs.caller_event_name == 'schedule' ||
              inputs.caller_event_name == 'workflow_dispatch' ||
              (inputs.caller_event_name == 'pull_request' && github.repository == 'alibaba/neug')
            )
          )
        ) }}
    env:
      CIBW_BUILD: ${{ needs.determine_python_versions.outputs.cibw_build }}
      # NeuG's Windows toolchain is x64-only (msvc-dev-cmd arch: x64, vcpkg
      # x64-windows-static-md). cibuildwheel's default Windows arch list also
      # contains x86, whose 32-bit python313.lib is architecture-incompatible
      # with the /machine:x64 link (LNK4272 -> LNK2001 __imp_Py* unresolved).
      CIBW_ARCHS_WINDOWS: AMD64
      NEUG_COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: checkout
        id: checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # cibuildwheel builds C extensions in subprocesses that inherit this
      # MSVC environment (cl.exe on PATH), required for the Ninja generator.
      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Python for windows
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.windows_python }}

      # The runner's vcpkg (classic mode) ships with no pre-built packages;
      # without a static-MD OpenSSL CMake falls back to the system dynamic
      # DLLs, which Python 3.8+ cannot load from an installed wheel.
      - name: Setup vcpkg
        run: |
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          Write-Host "Using vcpkg at: $env:VCPKG_INSTALLATION_ROOT"

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_ROOT }}/installed
          key: vcpkg-wheels-x64-windows-static-md-openssl-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            vcpkg-wheels-x64-windows-static-md-openssl-

      - name: Install OpenSSL via vcpkg
        run: |
          $vcpkgExe = Join-Path $env:VCPKG_ROOT "vcpkg.exe"
          $triplet = "x64-windows-static-md"
          $installDir = Join-Path $env:VCPKG_ROOT "installed\$triplet"
          if (Test-Path (Join-Path $installDir "lib\libssl.lib")) {
            Write-Host "OpenSSL already installed in $installDir (cache hit)"
          } else {
            Write-Host "Installing openssl:$triplet via vcpkg"
            & $vcpkgExe install "openssl:$triplet"
            if ($LASTEXITCODE -ne 0) {
              Write-Error "vcpkg failed to install openssl:$triplet"
              exit 1
            }
          }

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==${{ inputs.cibuildwheel_version }}

      - name: Set nightly wheel version
        if: inputs.set_nightly_version
        run: |
          $version = (Get-Content "$env:GITHUB_WORKSPACE/NEUG_VERSION" -Raw).Trim()
          $shortSha = (git rev-parse --short HEAD).Trim()
          Set-Content -Path "$env:GITHUB_WORKSPACE/NEUG_VERSION" -Value "$version+$shortSha"
          Write-Host "Set nightly wheel version to $version+$shortSha"

      # Build subprocesses on Windows inherit the parent environment, so
      # CMAKE_GENERATOR/CMAKE_ARGS reach setup.py inside cibuildwheel. Ninja
      # (preinstalled on windows-2022) is a single-config generator, which
      # makes setup.py's msvc branch skip the -A/--config VS flags.
      - name: Build wheels
        env:
          CMAKE_GENERATOR: Ninja
          CMAKE_ARGS: -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows-static-md -DOPENSSL_ROOT_DIR=${{ env.VCPKG_ROOT }}/installed/x64-windows-static-md
        run: |
          $env:CMAKE_BUILD_PARALLEL_LEVEL = "$env:NUMBER_OF_PROCESSORS"
          $env:BUILD_TYPE = "RELEASE"
          python -m cibuildwheel ./tools/python_bind --output-dir wheelhouse

      - name: Upload wheel artifacts
        if: ${{
              (inputs.mode == 'release' && (inputs.caller_event_name == 'workflow_dispatch' || inputs.caller_event_name == 'release' || (inputs.caller_event_name == 'push' && startsWith(github.ref, 'refs/tags/')))) ||
              (inputs.mode == 'nightly' && (inputs.caller_event_name == 'workflow_dispatch' || inputs.caller_event_name == 'schedule') && github.repository == 'alibaba/neug')
            }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.mode == 'nightly' && format('cibw-wheels-windows-x86_64-{0}', github.sha) || format('wheels-windows-x86_64-{0}', github.run_id) }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

      - name: Run simple test
        if: inputs.mode == 'release'
        env:
          TMP_DIR: ${{ github.workspace }}/${{ github.run_id }}
        run: |
          python -m pip install --upgrade pip
          python -m pip uninstall -y neug || Write-Host "Uninstalled neug if it was installed"
          Get-ChildItem wheelhouse -Filter *.whl | ForEach-Object {
            python -m pip install $_.FullName || Write-Host "Failed to install $($_.Name)"
          }
          if (Test-Path "$env:TMP_DIR/test_example") {
            Remove-Item -Recurse -Force "$env:TMP_DIR/test_example"
          }
          $env:GLOG_v = "10"
          python tools/python_bind/example/simple_example.py example_dataset/modern_graph "$env:TMP_DIR/test_example"

      - name: Run NeuG-Cli test
        if: inputs.mode == 'release'
        run: |
          neug-cli --help
          neug-cli --version

  build_wheels_windows_arm64:
    needs:
      - determine_python_versions
    # Requires a GitHub-hosted Windows ARM64 runner (windows-11-arm).
    # Cross-compilation from x64 is not attempted in this first iteration.
    runs-on: windows-11-arm
    timeout-minutes: 300
    defaults:
      run:
        shell: pwsh
    if: ${{ (inputs.target_platform == 'all' || inputs.target_platform == 'windows-arm64') && (
          (
            inputs.mode == 'release' &&
            (
              startsWith(github.ref, 'refs/tags/v') ||
              inputs.caller_event_name == 'workflow_dispatch' ||
              inputs.caller_event_name == 'pull_request' ||
              (inputs.caller_event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'alibaba/neug')
            )
          ) ||
          (
            inputs.mode == 'nightly' &&
            (
              inputs.caller_event_name == 'schedule' ||
              inputs.caller_event_name == 'workflow_dispatch' ||
              (inputs.caller_event_name == 'pull_request' && github.repository == 'alibaba/neug')
            )
          )
        ) }}
    env:
      CIBW_BUILD: ${{ needs.determine_python_versions.outputs.cibw_build }}
      CIBW_ARCHS_WINDOWS: ARM64
      NEUG_COMMIT_SHA: ${{ github.sha }}
