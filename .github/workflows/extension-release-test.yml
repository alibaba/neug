name: Extension Release Test

on:
  schedule:
    # Trigger at 22:00 CST (14:00 UTC) every day
    - cron: '0 14 * * *'
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/extension-release-test.yml'

concurrency:
  group: ${{ github.repository }}-${{ github.event.number || github.head_ref || github.sha }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  extension-release-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-14
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: ubuntu-latest
            platform-name: "linux-x86_64"
            arch: "x86_64"

          - os: ubuntu-24.04-arm
            platform-name: "linux-arm64"
            arch: "arm64"

          - os: macos-14
            platform-name: "macos-arm64"
            arch: "arm64"
    steps:
    - name: checkout
      id: checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
        cache: 'pip'

    - name: Install NeuG and test dependencies
      run: |
        pip install neug pytest

    - name: Run Python Test
      env:
        NEUG_RUN_EXTENSION_TESTS: "1"
        # Test the pip-installed wheel, not the in-repo source package.
        # Without this the checkout's `neug` package shadows site-packages,
        # INSTALL downloads extensions into the source tree, and LOAD fails
        # on macOS because `@loader_path/../../libneug.dylib` does not exist
        # there (libneug.dylib lives in site-packages).
        NEUG_TEST_INSTALLED_PACKAGE: "1"
      run: |
        # Run from the repo root so neither the CWD (`python -m` prepends it
        # to sys.path) nor conftest.py can shadow the installed wheel with
        # the in-repo `neug` package.
        cd ${GITHUB_WORKSPACE}
        export FLEX_DATA_DIR=${GITHUB_WORKSPACE}/example_dataset/modern_graph
        python3 -c "import neug; assert 'site-packages' in neug.__file__, 'neug resolved to %s instead of the installed wheel' % neug.__file__"
        python3 -m pytest tools/python_bind/tests/test_extension_install_load.py tools/python_bind/tests/test_alter_property.py -v
        python3 tools/python_bind/example/complex_test.py
    