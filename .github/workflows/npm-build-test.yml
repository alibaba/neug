name: NPM Test

on:
  workflow_call: {}
  workflow_dispatch: {}
  schedule:
    # Trigger at 22:00 CST (14:00 UTC) every day
    - cron: '0 14 * * *'
  push:
    branches:
      - main
    paths: &npm_paths
      - 'cmake/**'
      - 'src/**'
      - 'include/**'
      - 'proto/**'
      - 'third_party/**'
      - 'tools/nodejs_bind/**'
      - '.github/workflows/npm-build-test.yml'
      - 'scripts/install_deps.sh'
      - 'CMakeLists.txt'
      - 'NEUG_VERSION'
  pull_request:
    branches:
      - main
    paths: *npm_paths

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.number || github.head_ref || github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  format_check:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'workflow_call'
    uses: ./.github/workflows/format-check.yml
    with:
      is_pull_request: ${{ github.event_name == 'pull_request' }}

  build_npm_linux_x86_64:
    needs: format_check
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ${{ github.repository == 'alibaba/neug' && fromJSON('["self-hosted", "daily", "linux", "x64"]') || 'ubuntu-22.04' }}
    runs-on: ${{ matrix.runner }}
    env:
      CONTAINER_NAME: neug-npm-x86_64-${{ github.run_id }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Start container
        run: |
          docker run -d --name ${{ env.CONTAINER_NAME }} \
            -u 1001:1001 \
            -v ${{ github.workspace }}:/project \
            -w /project \
            neug-registry.cn-hongkong.cr.aliyuncs.com/neug/neug-manylinux:v0.1.3-x86_64-node \
            sleep infinity

          docker exec ${{ env.CONTAINER_NAME }} bash -c '
            mkdir -p /home/neug/.local
            curl -fsSL https://nodejs.org/dist/v20.0.0/node-v20.0.0-linux-x64.tar.xz \
              | tar -xJ -C /home/neug/.local --strip-components=1
            curl -fsSL https://github.com/NixOS/patchelf/releases/download/0.19.0/patchelf-0.19.0-x86_64.tar.gz \
              | tar -xz -C /home/neug/.local
            export PATH=/home/neug/.local/bin:$PATH
            cp /root/.neug_env /home/neug/.neug_env 2>/dev/null || true
            git config --global --add safe.directory /project
            . /home/neug/.neug_env
            git submodule update --init --recursive
          '

      - name: Build
        run: |
          docker exec ${{ env.CONTAINER_NAME }} bash -c '
            export PATH=/home/neug/.local/bin:$PATH
            . /home/neug/.neug_env
            cd /project/tools/nodejs_bind
            make build EXTRA_CMAKE_FLAGS="-DCMAKE_PREFIX_PATH=/opt/neug/ -DOPENSSL_ROOT_DIR=/opt/neug"
          '

      - name: Pack
        run: |
          docker exec ${{ env.CONTAINER_NAME }} bash -c '
            export PATH=/home/neug/.local/bin:$PATH
            . /home/neug/.neug_env
            cd /project/tools/nodejs_bind
            make pack EXTRA_CMAKE_FLAGS="-DCMAKE_PREFIX_PATH=/opt/neug/ -DOPENSSL_ROOT_DIR=/opt/neug"
          '

      - name: Prepare test data
        run: |
          docker exec ${{ env.CONTAINER_NAME }} bash -c '
            export PATH=/home/neug/.local/bin:$PATH
            . /home/neug/.neug_env
            git clone -b master --single-branch --depth=1 https://github.com/GraphScope/gstest.git /project/gstest
            rm -rf /tmp/modern_graph /tmp/tinysnb /tmp/ldbc
            export FLEX_DATA_DIR=/project/example_dataset/modern_graph
            /project/build/tools/utils/bulk_loader -g /project/example_dataset/modern_graph/graph.yaml -l /project/example_dataset/modern_graph/import.yaml -d /tmp/modern_graph
            export FLEX_DATA_DIR=/project/example_dataset/tinysnb
            /project/build/tools/utils/bulk_loader -g /project/example_dataset/tinysnb/graph.yaml -l /project/example_dataset/tinysnb/import.yaml -d /tmp/tinysnb
            export FLEX_DATA_DIR=/project/gstest/flex/ldbc-sf01-long-date
            /project/build/tools/utils/bulk_loader -g /project/example_dataset/ldbc/graph.yaml -l /project/example_dataset/ldbc/import.yaml -d /tmp/ldbc
          '

      - name: Test
        run: |
          docker exec ${{ env.CONTAINER_NAME }} bash -c '
            export PATH=/home/neug/.local/bin:$PATH
            . /home/neug/.neug_env
            cd /project/tools/nodejs_bind
            node tests/test-shim.js
          '

      - name: Stop container
        if: always()
        run: |
          docker rm -f ${{ env.CONTAINER_NAME }} || true

      - name: Upload npm tarball
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-linux-x86_64-${{ github.run_id }}
          path: ./tools/nodejs_bind/graphscope-neug-linux-x86_64-*.tgz
          if-no-files-found: error

  build_npm_linux_arm64:
    needs: format_check
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ${{ github.repository == 'alibaba/neug' && fromJSON('["self-hosted", "daily", "linux", "arm64"]') || 'ubuntu-22.04-arm' }}
    runs-on: ${{ matrix.runner }}
    env:
      CONTAINER_NAME: neug-npm-arm64-${{ github.run_id }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Start container
        run: |
          docker run -d --name ${{ env.CONTAINER_NAME }} \
            -u 1001:1001 \
            -v ${{ github.workspace }}:/project \
            -w /project \
            neug-registry.cn-hongkong.cr.aliyuncs.com/neug/neug-manylinux:v0.1.3-arm64-node \
            sleep infinity

          docker exec ${{ env.CONTAINER_NAME }} bash -c '
            mkdir -p /home/neug/.local
            curl -fsSL https://nodejs.org/dist/v20.0.0/node-v20.0.0-linux-arm64.tar.xz \
              | tar -xJ -C /home/neug/.local --strip-components=1
            curl -fsSL https://github.com/NixOS/patchelf/releases/download/0.19.0/patchelf-0.19.0-aarch64.tar.gz \
              | tar -xz -C /home/neug/.local
            export PATH=/home/neug/.local/bin:$PATH
            cp /root/.neug_env /home/neug/.neug_env 2>/dev/null || true
            git config --global --add safe.directory /project
            . /home/neug/.neug_env
            git submodule update --init --recursive
          '

      - name: Build
        run: |
          docker exec ${{ env.CONTAINER_NAME }} bash -c '
            export PATH=/home/neug/.local/bin:$PATH
            . /home/neug/.neug_env
            cd /project/tools/nodejs_bind
            make build EXTRA_CMAKE_FLAGS="-DCMAKE_PREFIX_PATH=/opt/neug/ -DOPENSSL_ROOT_DIR=/opt/neug"
          '

      - name: Pack
        run: |
          docker exec ${{ env.CONTAINER_NAME }} bash -c '
            export PATH=/home/neug/.local/bin:$PATH
            . /home/neug/.neug_env
            cd /project/tools/nodejs_bind
            make pack EXTRA_CMAKE_FLAGS="-DCMAKE_PREFIX_PATH=/opt/neug/ -DOPENSSL_ROOT_DIR=/opt/neug"
          '

      - name: Prepare test data
        run: |
          docker exec ${{ env.CONTAINER_NAME }} bash -c '
            export PATH=/home/neug/.local/bin:$PATH
            . /home/neug/.neug_env
            git clone -b master --single-branch --depth=1 https://github.com/GraphScope/gstest.git /project/gstest
            rm -rf /tmp/modern_graph /tmp/tinysnb /tmp/ldbc
            export FLEX_DATA_DIR=/project/example_dataset/modern_graph
            /project/build/tools/utils/bulk_loader -g /project/example_dataset/modern_graph/graph.yaml -l /project/example_dataset/modern_graph/import.yaml -d /tmp/modern_graph
            export FLEX_DATA_DIR=/project/example_dataset/tinysnb
            /project/build/tools/utils/bulk_loader -g /project/example_dataset/tinysnb/graph.yaml -l /project/example_dataset/tinysnb/import.yaml -d /tmp/tinysnb
            export FLEX_DATA_DIR=/project/gstest/flex/ldbc-sf01-long-date
            /project/build/tools/utils/bulk_loader -g /project/example_dataset/ldbc/graph.yaml -l /project/example_dataset/ldbc/import.yaml -d /tmp/ldbc
          '

      - name: Test
        run: |
          docker exec ${{ env.CONTAINER_NAME }} bash -c '
            export PATH=/home/neug/.local/bin:$PATH
            . /home/neug/.neug_env
            cd /project/tools/nodejs_bind
            node tests/test-shim.js
          '

      - name: Stop container
        if: always()
        run: |
          docker rm -f ${{ env.CONTAINER_NAME }} || true

      - name: Upload npm tarball
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-linux-arm64-${{ github.run_id }}
          path: ./tools/nodejs_bind/graphscope-neug-linux-arm64-*.tgz
          if-no-files-found: error

  build_npm_windows_x86_64:
    needs: format_check
    runs-on: windows-2022
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Keep the Windows build ABI baseline aligned with Linux package builds.
          node-version: '20.0.0'
          cache: 'npm'
          cache-dependency-path: tools/nodejs_bind/package-lock.json

      - name: Install OpenSSL via vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          & "$vcpkgRoot\vcpkg.exe" install openssl:x64-windows-static-md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Node.js build dependencies
        shell: pwsh
        run: |
          npm ci --prefix tools/nodejs_bind

          $nodeVersion = node -p "process.versions.node"
          $nodeDevDir = Join-Path $env:RUNNER_TEMP "node-v$nodeVersion-dev"
          $headersArchive = Join-Path $env:RUNNER_TEMP "node-headers.tar.gz"
          $headersUrl = "https://nodejs.org/dist/v$nodeVersion/node-v$nodeVersion-headers.tar.gz"
          $nodeLibUrl = "https://nodejs.org/dist/v$nodeVersion/win-x64/node.lib"

          Invoke-WebRequest $headersUrl -OutFile $headersArchive
          New-Item -ItemType Directory -Force $nodeDevDir | Out-Null
          tar -xzf $headersArchive -C $nodeDevDir --strip-components=1
          Invoke-WebRequest $nodeLibUrl -OutFile (Join-Path $nodeDevDir "node.lib")

          "NODE_INCLUDE_DIR=$nodeDevDir\include\node" >> $env:GITHUB_ENV
          "NODE_IMPORT_LIB=$nodeDevDir\node.lib" >> $env:GITHUB_ENV

      - name: Configure CMake
        shell: pwsh
        run: |
          $vcpkgToolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT "scripts\buildsystems\vcpkg.cmake"
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$vcpkgToolchain" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md `
            -DBUILD_NODEJS=ON `
            -DBUILD_PYTHON=OFF `
            -DWITH_MIMALLOC=OFF `
            -DNEUG_NATIVE_ARCH=OFF `
            -DNODE_INCLUDE_DIR="$env:NODE_INCLUDE_DIR" `
            -DNODE_IMPORT_LIB="$env:NODE_IMPORT_LIB" `
            .

      - name: Build
        shell: pwsh
        run: |
          $jobs = [Math]::Min([Environment]::ProcessorCount, 8)
          cmake --build build --target neug_node_bind -j $jobs

      - name: Stage native artifacts
        shell: pwsh
        run: |
          $stageDir = "tools/nodejs_bind/build/Release/windows_x86_64"
          New-Item -ItemType Directory -Force $stageDir | Out-Null
          Copy-Item "build/tools/nodejs_bind/neug_node_bind.node" $stageDir
          Copy-Item "build/tools/nodejs_bind/neug.dll" $stageDir

      - name: Prepare test data
        shell: pwsh
        env:
          FLEX_DATA_DIR: ${{ github.workspace }}\example_dataset\modern_graph
        run: |
          $tmpRoot = Join-Path ([IO.Path]::GetPathRoot($env:RUNNER_TEMP)) "tmp"
          New-Item -ItemType Directory -Force $tmpRoot | Out-Null
          Remove-Item -Recurse -Force (Join-Path $tmpRoot "modern_graph") -ErrorAction SilentlyContinue
          Set-Location tools/nodejs_bind
          node -e "const { prepareModernGraphDataset } = require('./tests/test-shim'); const { Database } = require('./lib'); prepareModernGraphDataset(Database);"

      - name: Test
        shell: pwsh
        env:
          FLEX_DATA_DIR: ${{ github.workspace }}\example_dataset\modern_graph
        run: |
          Set-Location tools/nodejs_bind
          node tests/test-shim.js

      - name: Pack
        shell: pwsh
        run: |
          Set-Location tools/nodejs_bind
          Copy-Item package.json package.json.ci
          try {
            $package = Get-Content package.json -Raw | ConvertFrom-Json
            $package.name = "@graphscope-neug/windows-x86_64"
            $package | Add-Member -NotePropertyName os -NotePropertyValue @("win32") -Force
            $package | Add-Member -NotePropertyName cpu -NotePropertyValue @("x64") -Force
            $package | ConvertTo-Json -Depth 100 | Set-Content package.json
            npm pack
            if ($LASTEXITCODE -ne 0) { throw "npm pack failed with exit code $LASTEXITCODE" }
          } finally {
            Move-Item -Force package.json.ci package.json
          }

      - name: Upload npm tarball
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-windows-x86_64-${{ github.run_id }}
          path: ./tools/nodejs_bind/graphscope-neug-windows-x86_64-*.tgz
          if-no-files-found: error

  build_npm_macos_aarch64:
    needs: format_check
    if: github.event_name == 'workflow_call' || github.event_name == 'release' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          bash scripts/install_deps.sh

      - name: Prepare for macos
        run: |
          echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> $GITHUB_ENV
          echo "MACOSX_DEPLOYMENT_TARGET=11.0"
          source ~/.neug_env
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$(sysctl -n hw.ncpu)" >> $GITHUB_ENV

      - name: Install macOS dependency bundling tool
        run: |
          python3 -m venv "${RUNNER_TEMP}/delocate-venv"
          "${RUNNER_TEMP}/delocate-venv/bin/python" -m pip install delocate==0.13.0
          echo "${RUNNER_TEMP}/delocate-venv/bin" >> "$GITHUB_PATH"

      - name: Build
        run: |
          source ~/.neug_env
          cd tools/nodejs_bind
          make build EXTRA_CMAKE_FLAGS="-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0"

      - name: Pack
        run: |
          source ~/.neug_env
          cd tools/nodejs_bind
          make pack EXTRA_CMAKE_FLAGS="-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0"

      - name: Prepare test data
        run: |
          source ~/.neug_env
          git clone -b master --single-branch --depth=1 https://github.com/GraphScope/gstest.git ${GITHUB_WORKSPACE}/gstest
          rm -rf /tmp/modern_graph /tmp/tinysnb /tmp/ldbc
          export FLEX_DATA_DIR=${GITHUB_WORKSPACE}/example_dataset/modern_graph
          ${GITHUB_WORKSPACE}/build/tools/utils/bulk_loader -g ${GITHUB_WORKSPACE}/example_dataset/modern_graph/graph.yaml -l ${GITHUB_WORKSPACE}/example_dataset/modern_graph/import.yaml -d /tmp/modern_graph
          export FLEX_DATA_DIR=${GITHUB_WORKSPACE}/example_dataset/tinysnb
          ${GITHUB_WORKSPACE}/build/tools/utils/bulk_loader -g ${GITHUB_WORKSPACE}/example_dataset/tinysnb/graph.yaml -l ${GITHUB_WORKSPACE}/example_dataset/tinysnb/import.yaml -d /tmp/tinysnb
          export FLEX_DATA_DIR=${GITHUB_WORKSPACE}/gstest/flex/ldbc-sf01-long-date
          ${GITHUB_WORKSPACE}/build/tools/utils/bulk_loader -g ${GITHUB_WORKSPACE}/example_dataset/ldbc/graph.yaml -l ${GITHUB_WORKSPACE}/example_dataset/ldbc/import.yaml -d /tmp/ldbc

      - name: Test
        run: |
          source ~/.neug_env
          cd tools/nodejs_bind
          node tests/test-shim.js

      - name: Upload npm tarball
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-osx-arm64-${{ github.run_id }}
          path: ./tools/nodejs_bind/graphscope-neug-osx-arm64-*.tgz
          if-no-files-found: error

  # Nightly and manually dispatched builds verify the packages from this run
  # through the same test suite used by the published-package check.
  package_test:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs:
      - build_npm_linux_x86_64
      - build_npm_linux_arm64
      - build_npm_macos_aarch64
      - build_npm_windows_x86_64
    uses: ./.github/workflows/npm-package-test.yml
